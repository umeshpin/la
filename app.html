<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KTU Photo & Signature Tool</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6fa;--card:#fff;--ink:#14202e;--mute:#5b6b7d;--line:#d5dde7;--acc:#0b5cab;--accink:#fff;--ok:#12794a;--bad:#b3261e;--track:#e3e9f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--card:#18222f;--ink:#e8eef5;--mute:#93a3b5;--line:#2c3a4b;--acc:#5aa9f0;--accink:#06182b;--ok:#4cc38a;--bad:#ff8a80;--track:#263445}}
:root[data-theme="dark"]{--bg:#0f1620;--card:#18222f;--ink:#e8eef5;--mute:#93a3b5;--line:#2c3a4b;--acc:#5aa9f0;--accink:#06182b;--ok:#4cc38a;--bad:#ff8a80;--track:#263445}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
main{max-width:880px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 20px}
.adm{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px}
label{font-weight:600;display:block;margin-bottom:6px}
input[type=text]{width:100%;font:inherit;font-size:1.25rem;font-weight:700;letter-spacing:.04em;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-transform:uppercase}
input:focus-visible,button:focus-visible,input[type=range]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.fname{margin-top:8px;color:var(--mute);font-size:.9rem;overflow-wrap:anywhere}
.fname b{color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:1.1rem;margin:0 0 12px}
.pick{display:block;text-align:center;padding:10px;border:1.5px dashed var(--acc);border-radius:8px;color:var(--acc);font-weight:600;cursor:pointer;margin-bottom:12px}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.pick:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.stage{border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden;touch-action:none;margin:0 auto;max-width:100%}
.stage canvas{display:block;width:100%;height:auto;cursor:grab}
.stage.empty{display:grid;place-items:center;min-height:170px;color:#6b7a8c;font-size:.9rem;text-align:center;padding:12px}
.zoom{display:flex;align-items:center;gap:10px;margin:12px 0 4px;color:var(--mute);font-size:.9rem}
.zoom input{flex:1}
.hint{color:var(--mute);font-size:.82rem;margin:0 0 12px}
.meter{height:10px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.meter.over i{background:var(--bad)}
.stat{display:flex;justify-content:space-between;font-size:.92rem;margin-top:10px}
.stat strong{font-variant-numeric:tabular-nums}
.msg{min-height:1.4em;font-size:.88rem;color:var(--mute);margin:6px 0 10px}
.msg.bad{color:var(--bad)}
button.dl{width:100%;font:inherit;font-weight:700;padding:12px;border:0;border-radius:8px;background:var(--acc);color:var(--accink);cursor:pointer}
button.dl:disabled{opacity:.4;cursor:not-allowed}
.foot{margin-top:18px;color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<main>
<h1>Photo & signature tool</h1>
<p class="sub">Use any image. The download is always a JPEG under 30 KB, named for the KTU portal.</p>

<div class="adm">
  <label for="adm">College admission number</label>
  <input id="adm" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" placeholder="Type your admission number">
  <div class="fname">Files will be named <b id="n1">ADMNO_PHOTO.jpg</b> and <b id="n2">ADMNO_SIGN.jpg</b></div>
</div>

<div class="grid" id="grid"></div>

<p class="foot">Your images stay on this device. Nothing is uploaded from this page. Drag the picture to move it, and use the slider to zoom.</p>
</main>

<script>
const LIMIT = 29000;            // bytes; safely under 30 KB
const CFG = [
  {key:'PHOTO', title:'Photo', W:413, H:531, hint:'Face the camera, plain light background. Crop frame is 3.5 × 4.5 cm.'},
  {key:'SIGN',  title:'Signature', W:600, H:200, hint:'Sign in dark ink on white paper, then photograph it straight on.'}
];
const admEl = document.getElementById('adm');
const cards = {};

function cleanAdm(){ return admEl.value.toUpperCase().replace(/[^A-Z0-9_-]/g,''); }
function fname(k){ return (cleanAdm()||'ADMNO') + '_' + k + '.jpg'; }

function build(c){
  const d = document.createElement('div'); d.className='card';
  d.innerHTML = `<h2>${c.title}</h2>
  <label class="pick">Choose ${c.title.toLowerCase()} image<input type="file" accept="image/*"></label>
  <div class="stage empty"><span>No image chosen yet</span></div>
  <p class="hint" style="margin-top:8px">${c.hint}</p>
  <div class="zoom"><span>Zoom</span><input type="range" min="0" max="100" value="0" disabled aria-label="Zoom ${c.title}"></div>
  <div class="stat"><span>Size</span><strong class="sz">–</strong></div>
  <div class="meter"><i></i></div>
  <div class="msg"></div>
  <button class="dl" disabled>Download ${c.key}</button>`;
  document.getElementById('grid').appendChild(d);
  const st = {c, img:null, z:1, zmin:1, ox:0, oy:0, blob:null, timer:null, run:0,
    stage:d.querySelector('.stage'), file:d.querySelector('input[type=file]'), range:d.querySelector('input[type=range]'),
    sz:d.querySelector('.sz'), meter:d.querySelector('.meter'), bar:d.querySelector('.meter i'), msg:d.querySelector('.msg'), btn:d.querySelector('.dl'), cv:null};
  cards[c.key]=st;

  st.file.addEventListener('change', e=>{
    const f=e.target.files[0]; if(!f) return;
    const url=URL.createObjectURL(f), im=new Image();
    im.onload=()=>{ st.img=im; setup(st); URL.revokeObjectURL(url); };
    im.onerror=()=>{ say(st,'This file could not be read as an image. Try a JPEG or PNG.',true); };
    im.src=url;
  });
  st.range.addEventListener('input', ()=>{
    st.z = st.zmin + (3 - st.zmin) * st.range.value/100; draw(st); schedule(st);
  });
  st.btn.addEventListener('click', ()=>{
    if(!st.blob) return;
    const a=document.createElement('a'); a.href=URL.createObjectURL(st.blob); a.download=fname(c.key);
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  });
}

function setup(st){
  const {W,H}=st.c, iw=st.img.naturalWidth, ih=st.img.naturalHeight;
  const cover=Math.max(W/iw,H/ih), contain=Math.min(W/iw,H/ih);
  st.zmin=contain/cover; st.z=1; st.ox=0; st.oy=0;
  st.range.disabled=false; st.range.value=Math.round((1-st.zmin)/(3-st.zmin)*100);
  st.stage.className='stage'; st.stage.innerHTML='';
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; st.cv=cv; st.stage.appendChild(cv);
  st.stage.style.maxWidth = (st.c.key==='PHOTO'?'300px':'100%');
  let drag=null;
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,ox:st.ox,oy:st.oy};cv.style.cursor='grabbing';});
  cv.addEventListener('pointermove',e=>{ if(!drag) return; const r=cv.getBoundingClientRect();
    st.ox=drag.ox+(e.clientX-drag.x)/r.width; st.oy=drag.oy+(e.clientY-drag.y)/r.height; draw(st); schedule(st);});
  const end=()=>{drag=null;cv.style.cursor='grab';};
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  draw(st); schedule(st);
}

function render(st, ctx, w, h){
  const {W,H}=st.c, iw=st.img.naturalWidth, ih=st.img.naturalHeight;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  const s=Math.max(W/iw,H/ih)*st.z*(w/W);
  const dw=iw*s, dh=ih*s;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(st.img, w/2+st.ox*w-dw/2, h/2+st.oy*h-dh/2, dw, dh);
}
function draw(st){ render(st, st.cv.getContext('2d'), st.c.W, st.c.H); }

function schedule(st){ clearTimeout(st.timer); st.timer=setTimeout(()=>compress(st),220); }

const toBlob=(cv,q)=>new Promise(r=>cv.toBlob(r,'image/jpeg',q));

async function compress(st){
  const my=++st.run; st.btn.disabled=true; st.blob=null; say(st,'Compressing…');
  const {W,H}=st.c; let best=null, bestDim='';
  for(let sc=1; sc>=0.3 && !best; sc-=0.1){
    const w=Math.round(W*sc), h=Math.round(H*sc);
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h; render(st,cv.getContext('2d'),w,h);
    let lo=0.35, hi=0.95, ok=null;
    const first=await toBlob(cv,hi);
    if(first.size<=LIMIT) ok=first;
    else {
      const low=await toBlob(cv,lo);
      if(low.size<=LIMIT){ ok=low;
        for(let i=0;i<7;i++){ const m=(lo+hi)/2, b=await toBlob(cv,m);
          if(b.size<=LIMIT){ok=b;lo=m;} else hi=m; }
      }
    }
    if(my!==st.run) return;
    if(ok){ best=ok; bestDim=w+' × '+h+' px'; }
  }
  if(my!==st.run) return;
  if(!best){ say(st,'Could not get this image under 30 KB. Try a different picture.',true); meter(st,0,true); return; }
  st.blob=best; meter(st,best.size,false);
  say(st,'Ready: '+bestDim+', JPEG.');
  st.btn.disabled=!cleanAdm();
  if(!cleanAdm()) say(st,'Type your admission number above to enable download.',true);
}

function meter(st,bytes,over){
  st.sz.textContent = bytes? (bytes/1000).toFixed(1)+' KB of 30 KB' : '–';
  st.bar.style.width = Math.min(100,bytes/30000*100)+'%';
  st.meter.classList.toggle('over',over);
}
function say(st,t,bad){ st.msg.textContent=t; st.msg.classList.toggle('bad',!!bad); }

function refreshNames(){
  document.getElementById('n1').textContent=fname('PHOTO');
  document.getElementById('n2').textContent=fname('SIGN');
  for(const k in cards){ const st=cards[k];
    if(st.blob){ st.btn.disabled=!cleanAdm(); say(st, cleanAdm()?'Ready to download.':'Type your admission number above to enable download.', !cleanAdm()); } }
}
admEl.addEventListener('input',()=>{ const p=admEl.selectionStart, v=admEl.value; admEl.value=v.toUpperCase().replace(/\s+/g,''); refreshNames(); });

CFG.forEach(build);
</script>
</body>
</html>
