<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diagonalization, one step at a time</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f8; --grid:rgba(40,90,160,.11); --card:#fbfdff; --ink:#14233b; --muted:#5b6b82; --line:#c7d3e3;
  --accent:#1f4fd8; --on-accent:#ffffff; --hi:#ffe066; --pivot:#bfe0ff; --good:#0f8a5f; --bad:#c4382b;
  --k0:#1f4fd8; --k1:#0f8a5f; --k2:#d4620f;
  --ui:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e2547; --grid:rgba(255,255,255,.07); --card:#12305a; --ink:#eaf2ff; --muted:#9db6d8; --line:#2b4c7d;
    --accent:#8fb8ff; --on-accent:#0b1b33; --hi:#7a6a12; --pivot:#24558f; --good:#5fdcaa; --bad:#ff9a8a;
    --k0:#8fb8ff; --k1:#5fdcaa; --k2:#ffb067;
  }
}
:root[data-theme="dark"]{
  --bg:#0e2547; --grid:rgba(255,255,255,.07); --card:#12305a; --ink:#eaf2ff; --muted:#9db6d8; --line:#2b4c7d;
  --accent:#8fb8ff; --on-accent:#0b1b33; --hi:#7a6a12; --pivot:#24558f; --good:#5fdcaa; --bad:#ff9a8a;
  --k0:#8fb8ff; --k1:#5fdcaa; --k2:#ffb067;
}
html{
  scroll-padding-top:env(safe-area-inset-top,0px);
  height:100%; font-size:clamp(15px,1.1vw,21px);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
body{margin:0;height:100%;background:transparent;color:var(--ink);font-family:var(--ui);}
*,*::before,*::after{box-sizing:border-box}
.app{height:100%;display:flex;flex-direction:column}

header{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.4rem;padding:.7rem 1.2rem;background:var(--card);border-bottom:1.5px solid var(--line)}
.id{display:flex;flex-direction:column;gap:.1rem}
.brand{font-family:var(--math);font-size:1.35rem;font-weight:600;white-space:nowrap}
.brand span{font-weight:400;color:var(--muted);font-size:1rem;margin-left:.5rem}
.by{font-size:.82rem;color:var(--muted)}
.by b{color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;flex:1}
.chip{font:inherit;font-size:.82rem;padding:.3rem .7rem;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.done{color:var(--ink);border-color:var(--muted)}
.chip.cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
.speed{display:flex;align-items:center;gap:.3rem;font-size:.85rem;color:var(--muted)}
.speed button{font:inherit;font-size:.82rem;padding:.3rem .7rem;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.speed button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.theme{font:inherit;font-size:.85rem;padding:.3rem .7rem;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.theme.strong{border-color:var(--accent);font-weight:700}

main{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) 17rem;gap:1rem;padding:1rem 1.2rem;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.stagecard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:1.2rem 1.4rem 1.6rem;min-height:26rem}
.kicker{font-size:.85rem;color:var(--muted);margin:0 0 .3rem}
h2{font-family:var(--math);font-weight:600;font-size:clamp(1.4rem,2.2vw,2.1rem);margin:0 0 .4rem;line-height:1.2}
.say{margin:0 0 1rem;max-width:64ch;font-size:1.02rem;line-height:1.5;color:var(--muted);min-height:1.5em}
.say b{color:var(--ink)}
.stage{display:flex;flex-direction:column;align-items:center;gap:1.15rem;padding:.4rem 0;overflow-x:auto}
.side{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:1rem 1.1rem}
.side h3{font-size:.95rem;margin:0 0 .6rem;font-weight:700}
.amini{display:flex;align-items:center;gap:.5rem;font-family:var(--math);padding-bottom:.7rem;margin-bottom:.7rem;border-bottom:1.5px dashed var(--line)}
.fact{font-family:var(--math);font-size:1.12rem;padding:.35rem 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.fact:last-child{border-bottom:0}
.fact.pop{animation:pop .6s ease-out}
@keyframes pop{0%{background:var(--hi)}100%{background:transparent}}
.small{font-size:.88rem}.muted{color:var(--muted)}

footer{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.2rem;background:var(--card);border-top:1.5px solid var(--line)}
.btn{font:inherit;font-weight:700;font-size:1.05rem;padding:.65rem 1.3rem;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);padding:.65rem 2rem;font-size:1.15rem}
.btn:focus-visible,.chip:focus-visible,.theme:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.prog{flex:1;display:flex;align-items:center;gap:.8rem;min-width:0}
.track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar{height:100%;width:0;background:var(--accent);transition:width .4s}
#count{font-size:.9rem;color:var(--muted);white-space:nowrap}
@media (max-width:620px){#replay{display:none}.btn{padding:.6rem .9rem}.btn.primary{padding:.6rem 1.3rem}}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(8px);transition:opacity calc(.45s*var(--spd,1)) ease,transform calc(.45s*var(--spd,1)) ease}
.rv.on{opacity:1;transform:none}

/* ---------- math layout ---------- */
.flexrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.7rem 1.1rem}
.op{font-family:var(--math);font-size:1.8rem;color:var(--muted)}
.eqrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.4em .8em;font-family:var(--math);font-size:clamp(1.15rem,2vw,1.55rem);text-align:center}
.eqrow.big{font-size:clamp(1.4rem,2.6vw,2.1rem)}
.eqrow.calc{font-size:clamp(1.05rem,1.8vw,1.3rem);color:var(--muted)}
.eqrow b{font-weight:600}
.big{font-family:var(--math)}
.t0{color:var(--k0)}.t1{color:var(--k1)}.t2{color:var(--k2)}
.boxed{border:2px solid var(--accent);border-radius:.5em;padding:.2em .7em;display:inline-block}
.opchip{background:var(--accent);color:var(--on-accent);padding:.15em .8em;border-radius:99px;font-family:var(--ui);font-size:.8em;font-weight:500}
.bad{color:var(--bad)}.good{color:var(--good)}
.chipk{display:inline-block;padding:.1em .6em;border-radius:.5em;font-family:var(--math)}
.chipk.k0{background:color-mix(in srgb,var(--k0) 22%,transparent)}
.chipk.k1{background:color-mix(in srgb,var(--k1) 22%,transparent)}
.chipk.k2{background:color-mix(in srgb,var(--k2) 22%,transparent)}

.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.7em;line-height:1.05;margin:0 .12em}
.fr i{font-style:normal;padding:0 .2em}
.fr i:first-child{border-bottom:1.5px solid currentColor}

.mat{display:inline-grid;grid-template-columns:repeat(var(--c),auto);gap:.35em .9em;padding:.4em .9em;position:relative;font-family:var(--math);font-size:clamp(1.05rem,2.4vw,1.7rem);vertical-align:middle}
.mat::before,.mat::after{content:"";position:absolute;top:0;bottom:0;width:.4em;border:2px solid var(--ink)}
.mat::before{left:0;border-right:0}
.mat::after{right:0;border-left:0}
.mat.det::before{border:0;border-left:2px solid var(--ink);width:0}
.mat.det::after{border:0;border-right:2px solid var(--ink);width:0}
.mat.md{font-size:clamp(1rem,2vw,1.35rem)}
.mat.sm{font-size:.95rem;gap:.15em .55em;padding:.25em .6em}
.cell{min-width:1.8em;text-align:center;padding:.1em .2em;line-height:1.5;border-radius:.35em;transition:background calc(.35s*var(--spd,1)),opacity calc(.35s*var(--spd,1)),color calc(.35s*var(--spd,1))}
.cell.hi{background:var(--hi)}
.cell.piv{background:var(--pivot)}
.cell.dim{opacity:.2}
.cell.ph{opacity:0}
.cell.res{color:var(--good);font-weight:600;animation:flash calc(.8s*var(--spd,1)) ease-out}
@keyframes flash{0%{transform:scale(1.4);background:var(--hi)}100%{transform:scale(1)}}
.cell.k0{background:color-mix(in srgb,var(--k0) 22%,transparent)}
.cell.k1{background:color-mix(in srgb,var(--k1) 22%,transparent)}
.cell.k2{background:color-mix(in srgb,var(--k2) 22%,transparent)}
.cell.sp{margin-left:.7em;position:relative}
.cell.sp::before{content:"";position:absolute;left:-.8em;top:-.2em;bottom:-.2em;border-left:2px dashed var(--muted)}

.matbox{display:inline-flex;gap:.3em;align-items:stretch;font-size:clamp(1.05rem,2.4vw,1.7rem)}
.matbox .mat{font-size:inherit}
.rlabs{display:grid;gap:.35em;padding:.4em 0;font-family:var(--ui);color:var(--muted)}
.rlab{height:calc(1.5em + .2em);padding:0 .2em;display:flex;align-items:center}
.rlab small{font-size:.55em}

.plan{display:grid;gap:.7rem;width:min(44rem,100%)}
.planitem{display:flex;gap:1rem;align-items:center;padding:.6rem .9rem;border:1.5px solid var(--line);border-radius:12px;font-size:1.05rem}
.planitem .num{font-family:var(--math);font-size:1.5rem;width:2rem;text-align:center;color:var(--accent);font-weight:600}

.trial{display:grid;gap:.5rem;font-family:var(--math);font-size:clamp(1.05rem,1.9vw,1.45rem);max-width:100%}
.trow{display:grid;grid-template-columns:max-content 1fr max-content max-content;gap:.6em;align-items:center;padding:.3em .6em;border-radius:.5em}
.trow.ok{background:color-mix(in srgb,var(--good) 18%,transparent)}
.trow.gap{color:var(--muted);justify-content:center;display:flex}

.synth{display:grid;grid-template-columns:repeat(5,minmax(3.6em,auto));grid-template-rows:repeat(3,auto);row-gap:.15em;font-family:var(--math);font-size:clamp(1.2rem,2.2vw,1.8rem);text-align:center}
.sc{padding:.15em .2em}
.sc.root{border-right:2px solid var(--ink);color:var(--accent);font-weight:600}
.hline{grid-column:2 / 6;grid-row:3;border-top:2px solid var(--ink);height:0;align-self:start}
.sc.res{color:var(--good);font-weight:600}

.vbox{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.vbox .cap{font-family:var(--math);font-size:1.05rem}
.vbox.k0 .cap{color:var(--k0)}.vbox.k1 .cap{color:var(--k1)}.vbox.k2 .cap{color:var(--k2)}

.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem;width:min(46rem,100%)}
.pick{font:inherit;text-align:left;padding:1rem 1.2rem;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.pick:hover,.pick:focus-visible{border-color:var(--accent);outline:none}
.pick b{display:block;font-family:var(--math);font-size:1.25rem;font-weight:600;margin-bottom:.3rem}
.pick span{color:var(--muted);font-size:.95rem;line-height:1.4}
.mswitch{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;font-size:.9rem;color:var(--muted);align-self:flex-start}
.mswitch button{font:inherit;font-size:.85rem;padding:.25rem .7rem;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.mswitch button:hover{border-color:var(--accent)}

/* ---------- matrix entry dialog ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,18,36,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:1rem}
.overlay.open{display:flex}
.dialog{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:1.3rem 1.6rem 1.5rem;width:min(36rem,100%);max-height:100%;overflow:auto}
.dialog h2{margin:0 0 .3rem}
.hint{margin:0 0 1rem;color:var(--muted);font-size:.95rem;line-height:1.45}
.entrywrap{display:flex;justify-content:center;margin:.3rem 0 .6rem}
.entrymat{font-size:1.2rem;gap:.5rem .7rem;padding:.5em 1em}
.entrymat input{font:inherit;font-family:var(--math);font-size:1.25rem;text-align:center;width:4.3em;padding:.4em .2em;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.entrymat input:focus{outline:none;border-color:var(--accent)}
.entrymat input.invalid{border-color:var(--bad)}
.err{color:var(--bad);min-height:1.5em;font-size:.95rem;margin:.2rem 0 .6rem;text-align:center}
.presets{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem;align-items:center;font-size:.9rem;color:var(--muted)}
.presets button{font:inherit;font-size:.85rem;padding:.3rem .7rem;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.presets button:hover{border-color:var(--accent)}
.dactions{display:flex;justify-content:flex-end;gap:.7rem}

@media (prefers-reduced-motion: reduce){
  .rv,.cell,.bar{transition:none}
  .cell.res,.fact.pop{animation:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="id">
      <div class="brand">Diagonalization<span>P⁻¹AP = D</span></div>
      <div class="by"><b>Dr. Umesh P.</b>, College of Engineering, Thalassery</div>
    </div>
    <nav class="chips" id="chips" aria-label="Sections"></nav>
    <div class="tools">
      <button class="theme strong" id="chmat" type="button">Change matrix</button>
      <div class="speed" id="speed" role="group" aria-label="Animation speed">
        <span>Animation</span>
        <button type="button" data-s="slow" aria-pressed="false">Slow</button>
        <button type="button" data-s="medium" aria-pressed="true">Medium</button>
        <button type="button" data-s="fast" aria-pressed="false">Fast</button>
      </div>
      <button class="theme" id="theme" type="button" aria-label="Switch light or dark theme">Light / dark</button>
    </div>
  </header>
  <main id="main">
    <section class="stagecard" aria-live="off">
      <p class="kicker" id="kicker"></p>
      <h2 id="title"></h2>
      <p class="say" id="say"></p>
      <div class="stage" id="stage"></div>
    </section>
    <aside class="side">
      <h3>Matrix and results so far</h3>
      <div class="amini" id="amini"></div>
      <div id="facts"></div>
    </aside>
  </main>
  <footer>
    <button class="btn" id="back" type="button">← Back</button>
    <div class="prog"><div class="track"><div class="bar" id="bar"></div></div><span id="count"></span></div>
    <button class="btn" id="replay" type="button">↻ Replay</button>
    <button class="btn primary" id="next" type="button">Next →</button>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dtitle">
    <h2 id="dtitle">Enter a 3×3 matrix</h2>
    <p class="hint">Use whole numbers, decimals (0.5) or fractions (1/2). An empty box counts as 0. The app finds exact answers when the eigenvalues are rational.</p>
    <div class="entrywrap"><div class="mat entrymat" id="entry" style="--c:3"></div></div>
    <p class="err" id="err" role="alert"></p>
    <div class="presets" id="presets"><span>Try:</span></div>
    <div class="dactions">
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn primary" id="gobtn" type="button">Diagonalize</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';

/* =====================================================================
   Exact rational arithmetic
   ===================================================================== */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;};
const lcm=(a,b)=>a/gcd(a,b)*b;
const LIM=5e7;
class Fr{
  constructor(n,d=1){
    if(d===0)throw new Error('Division by zero.');
    if(d<0){n=-n;d=-d;}
    const g=gcd(n,d)||1;
    this.n=n/g;this.d=d/g;
    if(Math.abs(this.n)>LIM||this.d>LIM)throw new Error('The numbers became too large for exact arithmetic. Try smaller entries.');
  }
  add(o){return new Fr(this.n*o.d+o.n*this.d,this.d*o.d);}
  sub(o){return new Fr(this.n*o.d-o.n*this.d,this.d*o.d);}
  mul(o){return new Fr(this.n*o.n,this.d*o.d);}
  div(o){return new Fr(this.n*o.d,this.d*o.n);}
  neg(){return new Fr(-this.n,this.d);}
  get zero(){return this.n===0;}
  get isInt(){return this.d===1;}
  get neg0(){return this.n<0;}
  eq(o){return this.n===o.n&&this.d===o.d;}
  val(){return this.n/this.d;}
  txt(){return (this.n<0?'−':'')+Math.abs(this.n)+(this.d===1?'':'/'+this.d);}
  html(){
    if(this.d===1)return this.txt();
    return (this.n<0?'−':'')+'<span class="fr"><i>'+Math.abs(this.n)+'</i><i>'+this.d+'</i></span>';
  }
}
const R=(n,d=1)=>new Fr(n,d);
const ZERO=R(0),ONE=R(1);
const NB='\u00a0';
const sub=['₁','₂','₃'];
const n3=[0,1,2];
const vn=['x','y','z'];
const pn=['t','s','u'];
const ph=x=>x.neg0?'('+x.html()+')':x.html();
const pp=x=>(x.neg0||!x.isInt)?'('+x.html()+')':x.html();
const pt=x=>(x.neg0||!x.isInt)?'('+x.txt()+')':x.txt();

function parseEntry(str){
  const t=String(str).trim().replace(/[−–]/g,'-').replace(/\s+/g,'');
  if(t==='')return ZERO;
  const m=t.match(/^([+-]?)(\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?$/);
  if(!m)throw new Error('bad');
  const toFr=s=>{
    if(s.indexOf('.')>=0){const p=s.split('.');return new Fr(Number(p[0]+p[1]),Math.pow(10,p[1].length));}
    return new Fr(Number(s));
  };
  let v=toFr(m[2]);
  if(m[3]){const dv=toFr(m[3]);if(dv.zero)throw new Error('zero');v=v.div(dv);}
  if(Math.abs(v.val())>1000)throw new Error('big');
  return m[1]==='-'?v.neg():v;
}

/* ---------- small matrix helpers ---------- */
const clone=M=>M.map(r=>r.slice());
const minorOf=(Mx,i,j)=>{
  const r=n3.filter(x=>x!==i),c=n3.filter(x=>x!==j);
  const S=r.map(a=>c.map(b=>Mx[a][b]));
  return {S,val:S[0][0].mul(S[1][1]).sub(S[0][1].mul(S[1][0]))};
};
const cofOf=(Mx,i,j)=>{const m=minorOf(Mx,i,j);return ((i+j)%2===0)?m.val:m.val.neg();};
const det3=Mx=>n3.reduce((s,j)=>s.add(Mx[0][j].mul(cofOf(Mx,0,j))),ZERO);
const mulM=(X,Y)=>X.map((row,i)=>Y[0].map((_,j)=>row.reduce((s,_v,k)=>s.add(X[i][k].mul(Y[k][j])),ZERO)));
const transpose=Mx=>Mx[0].map((_,j)=>Mx.map(r=>r[j]));
const eqM=(X,Y)=>X.every((r,i)=>r.every((v,j)=>v.eq(Y[i][j])));

/* ---------- Gauss-Jordan with a log of every row operation ---------- */
function gaussJordan(M0,split){
  const M=clone(M0),ops=[],piv=[];
  const rowTxt=row=>{
    if(split==null)return '['+row.map(x=>x.txt()).join(', ')+']';
    return '['+row.slice(0,split).map(x=>x.txt()).join(', ')+' | '+row.slice(split).map(x=>x.txt()).join(', ')+']';
  };
  let r=0;
  for(let c=0;c<3&&r<3;c++){
    let p=-1;
    for(let i=r;i<3;i++){if(!M[i][c].zero){p=i;break;}}
    if(p<0)continue;
    if(p!==r){
      const t=M[r];M[r]=M[p];M[p]=t;
      ops.push({op:'R'+sub[r]+' ↔ R'+sub[p],say:'Row '+(r+1)+' needs a nonzero entry in column '+(c+1)+', so swap rows '+(r+1)+' and '+(p+1)+'.',calc:'',after:clone(M),changed:[r,p],pivot:[]});
    }
    const pv=M[r][c];
    if(!pv.eq(ONE)){
      const bf=rowTxt(M[r]);
      const how=pv.eq(R(-1))?' × (−1)':' ÷ '+pt(pv);
      M[r]=M[r].map(x=>x.div(pv));
      ops.push({op:'R'+sub[r]+' → R'+sub[r]+how,say:'Make the pivot in row '+(r+1)+' equal to 1.',calc:bf+how+' = '+rowTxt(M[r]),after:clone(M),changed:[r],pivot:[]});
    }
    for(let i=0;i<3;i++){
      if(i===r)continue;
      const k=M[i][c];
      if(k.zero)continue;
      const bf=rowTxt(M[i]);
      M[i]=M[i].map((x,j)=>x.sub(k.mul(M[r][j])));
      const ak=k.neg0?k.neg():k;
      const coef=ak.eq(ONE)?'':pt(ak)+'·';
      const sg=k.neg0?'+':'−';
      ops.push({op:'R'+sub[i]+' → R'+sub[i]+' '+sg+' '+coef+'R'+sub[r],say:'Clear the entry '+(i<r?'above':'below')+' the pivot.',calc:bf+' '+sg+' '+coef+rowTxt(M[r])+' = '+rowTxt(M[i]),after:clone(M),changed:[i],pivot:[r]});
    }
    piv.push(c);r++;
  }
  return {ops,rref:M,piv};
}

/* ---------- number helpers ---------- */
function divisors(n){
  n=Math.abs(n);const out=[];
  for(let i=1;i*i<=n;i++){if(n%i===0){out.push(i);if(i!==n/i)out.push(n/i);}}
  return out;
}
function sqrtFr(x){
  if(x.neg0)return null;
  const sn=Math.round(Math.sqrt(x.n)),sd=Math.round(Math.sqrt(x.d));
  return (sn*sn===x.n&&sd*sd===x.d)?new Fr(sn,sd):null;
}
const rnd=x=>{let s=(Math.round(x*10000)/10000).toString();if(s==='-0')s='0';return s.replace('-','−');};
function numTxt(z){
  if(Math.abs(z.im)<1e-9)return rnd(z.re);
  return rnd(z.re)+(z.im<0?' − ':' + ')+rnd(Math.abs(z.im))+'i';
}
function cubicRoots(c2,c1,c0){
  const a=c2.val(),b=c1.val(),c=c0.val();
  const rad=1+Math.max(Math.abs(a),Math.abs(b),Math.abs(c));
  let z=[0,1,2].map(k=>({re:rad*0.5*Math.cos(0.9+2.1*k),im:rad*0.5*Math.sin(0.9+2.1*k)}));
  const mul=(p,q)=>({re:p.re*q.re-p.im*q.im,im:p.re*q.im+p.im*q.re});
  const sb=(p,q)=>({re:p.re-q.re,im:p.im-q.im});
  const dv=(p,q)=>{const d=q.re*q.re+q.im*q.im;return {re:(p.re*q.re+p.im*q.im)/d,im:(p.im*q.re-p.re*q.im)/d};};
  const poly=x=>{let r=mul(x,x);r=mul(r,x);const t2=mul(x,x);return {re:r.re+a*t2.re+b*x.re+c,im:r.im+a*t2.im+b*x.im};};
  for(let it=0;it<400;it++){
    z=z.map((zi,i)=>{
      let den={re:1,im:0};
      z.forEach((zj,j)=>{if(j!==i)den=mul(den,sb(zi,zj));});
      return sb(zi,dv(poly(zi),den));
    });
  }
  z=z.map(w=>({re:w.re,im:Math.abs(w.im)<1e-7?0:w.im}));
  return z.sort((p,q)=>q.re-p.re||q.im-p.im);
}

/* polynomial text */
function polyHTML(c2,c1,c0){
  const term=(c,pow)=>{
    if(c.zero)return '';
    const neg=c.neg0,a=neg?c.neg():c;
    const coef=(a.eq(ONE)&&pow>0)?'':a.html();
    return (neg?' − ':' + ')+coef+(pow===2?'λ²':pow===1?'λ':'');
  };
  return 'λ³'+term(c2,2)+term(c1,1)+term(c0,0);
}
function quadHTML(b1,b2){
  const term=(c,pow)=>{
    if(c.zero)return '';
    const neg=c.neg0,a=neg?c.neg():c;
    const coef=(a.eq(ONE)&&pow>0)?'':a.html();
    return (neg?' − ':' + ')+coef+(pow===1?'λ':'');
  };
  return 'λ²'+term(b1,1)+term(b2,0);
}
function substHTML(c2,c1,c0,v){
  const vp=(v.neg0||!v.isInt)?'('+v.txt()+')':v.txt();
  const term=(c,pow)=>{
    if(c.zero)return '';
    const neg=c.neg0,a=neg?c.neg():c;
    const sign=neg?' − ':' + ';
    if(pow===0)return sign+a.txt();
    const coef=a.eq(ONE)?'':(a.isInt?a.txt():'('+a.txt()+')')+'·';
    return sign+coef+vp+(pow===2?'²':'');
  };
  return vp+'³'+term(c2,2)+term(c1,1)+term(c0,0);
}
const factorHTML=r=>r.zero?'λ':r.neg0?'(λ + '+r.neg().html()+')':'(λ − '+r.html()+')';
function lin(list){
  let s='';
  list.forEach(([c,name])=>{
    if(c.zero)return;
    const neg=c.neg0,a=neg?c.neg():c;
    const body=(a.eq(ONE)?'':a.html())+name;
    if(!s)s=(neg?'−':'')+body;else s+=(neg?' − ':' + ')+body;
  });
  return s||'0';
}

/* =====================================================================
   Build every step for a given matrix
   ===================================================================== */
function makeFrames(A){
  const frames=[],facts=[];
  const add=o=>{frames.push(o);return o;};
  function opFrames(prefix,sec,label,start,ops,split,mTag){
    let cur=start;
    ops.forEach((o,i)=>{
      const before=cur;
      const fr={id:prefix+'_op'+(i+1),sec,title:label+': row operation '+(i+1)+' of '+ops.length,say:o.say,build:rowOpBuilder(before,o,split)};
      if(mTag)fr.m=mTag;
      add(fr);
      cur=o.after;
    });
  }

  /* ----- characteristic polynomial data ----- */
  const tr=A[0][0].add(A[1][1]).add(A[2][2]);
  const mn=n3.map(i=>minorOf(A,i,i));
  const S2=mn.reduce((s,m)=>s.add(m.val),ZERO);
  const dA=det3(A);
  const c2=tr.neg(),c1=S2,c0=dA.neg();

  /* ----- determinant frame (used for |A| and |P|) ----- */
  function detData(Mx){
    let best={z:-1};
    for(let i=0;i<3;i++){const z=Mx[i].filter(x=>x.zero).length;if(z>best.z)best={z,type:'row',k:i};}
    for(let j=0;j<3;j++){const z=n3.filter(i=>Mx[i][j].zero).length;if(z>best.z)best={z,type:'col',k:j};}
    const cells=best.type==='row'?n3.map(j=>[best.k,j]):n3.map(i=>[i,best.k]);
    const terms=cells.filter(([i,j])=>!Mx[i][j].zero).map(([i,j])=>{
      const m=minorOf(Mx,i,j),sg=((i+j)%2===0)?1:-1;
      return {i,j,a:Mx[i][j],S:m.S,val:m.val,sg,C:sg===1?m.val:m.val.neg()};
    });
    const det=terms.reduce((s,t)=>s.add(t.a.mul(t.C)),ZERO);
    return Object.assign({},best,{cells,terms,det});
  }
  function detFrame(cfg){
    const {id,sec,m,title,Mx,name}=cfg;
    const d=detData(Mx);
    const lineTxt=(d.type==='row'?Mx[d.k]:n3.map(i=>Mx[i][d.k])).map(x=>x.txt()).join(', ');
    const kind=d.type==='row'?'Row':'Column';
    const say=d.z===0?'No row or column has a zero, so expand along row 1 (any choice works).':kind+' '+(d.k+1)+' = ['+lineTxt+'] has '+d.z+' zero'+(d.z===1?'':'s')+', so expand along it.';
    const fr={id,sec,title,say,build(st){
      const mm=mat(Mx),sm=mat([[NB,NB],[NB,NB]],{cls:'det rv'});
      const fx=el('div','flexrow');fx.append(mm,el('span','op','→'),sm);
      const sym=d.cells.map(([i,j])=>'a'+sub[i]+sub[j]+'·C'+sub[i]+sub[j]).join(' + ');
      const L0=eqrow(['|'+name+'| = '+sym]);
      const Lt=d.terms.map(t=>eqrow(['C'+sub[t.i]+sub[t.j]+' = ('+(t.sg>0?'+1':'−1')+') · ('+pp(t.S[0][0])+'·'+pp(t.S[1][1])+' − '+pp(t.S[0][1])+'·'+pp(t.S[1][0])+') = '+ph(t.C)]));
      const tot=eqrow([d.terms.length?'|'+name+'| = '+d.terms.map(t=>pp(t.a)+'·'+pp(t.C)).join(' + ')+' = <b class="t2">'+ph(d.det)+'</b>':'|'+name+'| = <b class="t2">0</b>'],'big');
      st.append(fx,L0.el);
      Lt.forEach(x=>st.append(x.el));
      st.append(tot.el);
      const reset=()=>{for(let r=0;r<3;r++)for(let c=0;c<3;c++)cellAt(mm,r,c).className='cell';};
      const fns=[()=>{reset();d.cells.forEach(([i,j])=>cellAt(mm,i,j).classList.add('hi'));on(L0.spans);}];
      d.terms.forEach((t,ti)=>fns.push(()=>{
        reset();
        for(let r=0;r<3;r++)for(let c=0;c<3;c++){
          const x=cellAt(mm,r,c);
          if(r===t.i&&c===t.j)x.classList.add('hi');
          else if(r===t.i||c===t.j)x.classList.add('dim');
          else x.classList.add('piv');
        }
        t.S.forEach((row,r)=>row.forEach((v,c)=>{cellAt(sm,r,c).innerHTML=ch(v);}));
        on(sm);on(Lt[ti].spans);
      }));
      fns.push(()=>{reset();on(tot.spans);});
      seq(fns,1200,400);
    }};
    if(m)fr.m=m;
    add(fr);
    return d;
  }

  /* ===== Problem ===== */
  add({id:'start',sec:'prob',title:'The problem',
    say:'Diagonalize A: find an invertible matrix <b>P</b> and a diagonal matrix <b>D</b> so that P⁻¹AP = D.',
    build(st){
      const r=eqrow(['A =',mat(A).outerHTML],'big');
      const t=eqrow(['Find <b>P</b> and <b>D</b> such that &nbsp;<b>P⁻¹ A P = D</b>']);
      st.append(r.el,t.el);
      seq([()=>on(r.spans),()=>on(t.spans)],800,200);
    }});

  add({id:'plan',sec:'prob',title:'The plan',
    say:'Six steps. Each press of Next does one small piece.',
    build(st){
      const items=[
        ['1','Characteristic equation','λ³ − (trace)λ² + (sum of minors)λ − (determinant) = 0'],
        ['2','Eigenvalues','try a value for the first root, divide, factor the quadratic'],
        ['3','Eigenvectors','solve (A − λI)v = 0 by row reduction, once per eigenvalue'],
        ['4','Build P and D','eigenvectors become the columns of P, eigenvalues the diagonal of D'],
        ['5','Inverse of P','row-reduce [P | I], or use 1/det(P) · Adj(P). Your choice'],
        ['6','Check','multiply out P⁻¹AP and see D']
      ];
      const ol=el('div','plan');
      items.forEach(([n,h,d])=>ol.appendChild(el('div','planitem rv','<span class="num">'+n+'</span><div><b>'+h+'</b><br><span class="muted">'+d+'</span></div>')));
      st.appendChild(ol);
      seq([...ol.children].map(li=>()=>on(li)),450,200);
    }});

  /* ===== 1. Characteristic equation ===== */
  add({id:'form',sec:'char',title:'Characteristic equation of a 3×3 matrix',
    say:'Eigenvalues are the roots of det(A − λI) = 0. For a 3×3 matrix that expands into a ready-made formula.',
    build(st){
      const a=eqrow(['det(A − λI) = 0 &nbsp;expands to']);
      const b=eqrow(['λ³ − (<span class="t0">tr A</span>)λ² + (<span class="t1">M₁₁ + M₂₂ + M₃₃</span>)λ − <span class="t2">|A|</span> = 0'],'big');
      const l1=eqrow(['<span class="t0"><b>tr A</b></span> = sum of the diagonal entries']);
      const l2=eqrow(['<span class="t1"><b>M₁₁, M₂₂, M₃₃</b></span> = delete row i and column i, take the 2×2 determinant']);
      const l3=eqrow(['<span class="t2"><b>|A|</b></span> = determinant of A']);
      st.append(a.el,b.el,l1.el,l2.el,l3.el);
      seq([()=>on(a.spans),()=>on(b.spans),()=>on(l1.spans),()=>on(l2.spans),()=>on(l3.spans)],800,200);
    }});

  add({id:'trace',sec:'char',title:'Trace of A',
    say:'Add the entries on the main diagonal.',
    build(st){
      const m=mat(A),fx=el('div','flexrow');fx.append(m);
      const r=eqrow(['<span class="t0">tr A</span> =',A[0][0].html(),'+ '+ph(A[1][1]),'+ '+ph(A[2][2]),'= <b class="t0">'+tr.html()+'</b>'],'big');
      st.append(fx,r.el);on(r.spans[0]);
      seq([
        ()=>{cellAt(m,0,0).classList.add('hi');on(r.spans[1]);},
        ()=>{cellAt(m,1,1).classList.add('hi');on(r.spans[2]);},
        ()=>{cellAt(m,2,2).classList.add('hi');on(r.spans[3]);},
        ()=>on(r.spans[4])
      ],900,400);
    }});

  n3.forEach(i=>{
    const {S,val}=mn[i];
    add({id:'m'+i,sec:'char',title:'Principal minor M'+sub[i]+sub[i],
      say:'Cross out row '+(i+1)+' and column '+(i+1)+'. The 2×2 block that is left gives the minor.',
      build(st){
        const m=mat(A),sm=mat(S,{cls:'det rv'});
        const fx=el('div','flexrow');fx.append(m,el('span','op','→'),sm);
        const calc=eqrow(['<span class="t1">M'+sub[i]+sub[i]+'</span> = '+pp(S[0][0])+'·'+pp(S[1][1])+' − '+pp(S[0][1])+'·'+pp(S[1][0]),'= <b class="t1">'+ph(val)+'</b>'],'big');
        st.append(fx,calc.el);
        seq([
          ()=>{for(let r=0;r<3;r++)for(let c=0;c<3;c++){cellAt(m,r,c).classList.add((r===i||c===i)?'dim':'hi');}on(sm);},
          ()=>on(calc.spans[0]),
          ()=>on(calc.spans[1])
        ],1000,400);
      }});
  });

  add({id:'minsum',sec:'char',title:'Sum of the principal minors',
    say:'Add the three minors you just found.',
    build(st){
      const r=eqrow(['<span class="t1">M₁₁ + M₂₂ + M₃₃</span> =',ph(mn[0].val)+' + '+ph(mn[1].val)+' + '+ph(mn[2].val),'= <b class="t1">'+S2.html()+'</b>'],'big');
      st.append(r.el);
      seq([()=>on(r.spans[0]),()=>on(r.spans[1]),()=>on(r.spans[2])],900,300);
    }});

  detFrame({id:'det',sec:'char',title:'Determinant |A|',Mx:A,name:'A'});

  add({id:'chareq',sec:'char',title:'Write the characteristic equation',
    say:'Put the three numbers into the formula.',
    build(st){
      const r1=eqrow(['λ³ − (<span class="t0">tr A</span>)λ² + (<span class="t1">M₁₁+M₂₂+M₃₃</span>)λ − <span class="t2">|A|</span> = 0']);
      const r2=eqrow(['λ³ − (<span class="t0">'+tr.html()+'</span>)λ² + (<span class="t1">'+S2.html()+'</span>)λ − (<span class="t2">'+dA.html()+'</span>) = 0']);
      const r3=eqrow(['<span class="boxed">'+polyHTML(c2,c1,c0)+' = 0</span>'],'big');
      st.append(r1.el,r2.el,r3.el);
      seq([()=>on(r1.spans),()=>on(r2.spans),()=>on(r3.spans)],1000,300);
    }});
  facts.push(['trace','<span class="t0">tr A = '+tr.html()+'</span>']);
  n3.forEach(i=>facts.push(['m'+i,'M'+sub[i]+sub[i]+' = '+mn[i].val.html()]));
  facts.push(['det','<span class="t2">|A| = '+dA.html()+'</span>']);
  facts.push(['chareq',polyHTML(c2,c1,c0)+' = 0']);

  /* ===== 2. Eigenvalues: rational root search ===== */
  const evalP=v=>v.mul(v).mul(v).add(c2.mul(v).mul(v)).add(c1.mul(v)).add(c0);
  const Lcm=[c2,c1,c0].reduce((l,x)=>lcm(l,x.d),1);
  const a0=c0.mul(R(Lcm));
  let cands=[ZERO];
  if(!a0.zero){
    const set=new Map();
    divisors(a0.n).forEach(p=>divisors(Lcm).forEach(q=>{[1,-1].forEach(sg=>{const v=R(sg*p,q);set.set(v.txt(),v);});}));
    const arr=[...set.values()].sort((u,v)=>{
      const ui=u.isInt?0:1,vi=v.isInt?0:1;
      if(ui!==vi)return ui-vi;
      const d=Math.abs(u.val())-Math.abs(v.val());
      return d||v.val()-u.val();
    });
    cands=cands.concat(arr);
  }
  const fails=[];let root=null;
  for(const v of cands){const pv=evalP(v);if(pv.zero){root=v;break;}fails.push({v,pv});}

  add({id:'trial',sec:'eig',title:root?'First root by trial':'Looking for a rational root',
    say:root?'Substitute small values into p(λ) until the result is 0.':'A rational root must be ± (a divisor of the constant term) ÷ (a divisor of the leading coefficient).',
    build(st){
      const head=eqrow(['p(λ) = '+polyHTML(c2,c1,c0)],'big');
      const tb=el('div','trial');
      const mkRow=(v,pv,ok)=>el('div','trow rv'+(ok?' ok':''),['p('+v.txt()+')','= '+substHTML(c2,c1,c0,v),'= '+pv.html(),ok?'<span class="good">root ✓</span>':'<span class="bad">≠ 0</span>'].map(c=>'<span>'+c+'</span>').join(''));
      let shown=fails.map(x=>mkRow(x.v,x.pv,false));
      if(shown.length>5){shown=shown.slice(0,3).concat([el('div','trow gap rv','⋮ &nbsp;more trial values')]).concat(shown.slice(-2));}
      if(root)shown.push(mkRow(root,ZERO,true));
      shown.forEach(r=>tb.appendChild(r));
      const end=eqrow([root?'So <b>λ = '+root.html()+'</b> is a root, and <b>'+factorHTML(root)+'</b> is a factor of p(λ).':'None of the possible rational roots works, so p(λ) has no rational root.']);
      st.append(head.el,tb,end.el);on(head.spans);
      seq([...shown.map(r=>()=>on(r)),()=>on(end.spans)],1000,500);
    }});

  function stopFrames(ev,reason){
    add({id:'stop',sec:'eig',title:'The eigenvalues are not all rational',
      say:'Exact hand diagonalization stops here.',
      build(st){
        const lines=[
          eqrow(['Approximate eigenvalues: &nbsp;'+ev.map(z=>'<span class="chipk k'+(ev.indexOf(z)%3)+'">λ ≈ '+numTxt(z)+'</span>').join(' ')],'big'),
          eqrow([reason]),
          eqrow(['Try a matrix with rational eigenvalues, like the default example, to see every step.'],'calc')
        ];
        lines.forEach(x=>st.appendChild(x.el));
        seq(lines.map(x=>()=>on(x.spans)),1100,300);
      }});
    facts.push(['stop','λ ≈ '+ev.map(numTxt).join(', ')]);
    return {frames,facts,info:{diag:false,stopped:true}};
  }

  if(!root){
    const ev=cubicRoots(c2,c1,c0);
    const complex=ev.some(z=>z.im!==0);
    return stopFrames(ev,complex?'A has a pair of complex eigenvalues, so it cannot be diagonalized with real numbers. (With complex numbers it can, because the eigenvalues are distinct.)':'The eigenvalues are real but irrational. A is diagonalizable, but its eigenvectors contain square roots, and this app works in exact fractions.');
  }
  facts.push(['trial','root: λ = '+root.html()]);

  /* ----- synthetic division ----- */
  const bb=[ONE];
  bb.push(c2.add(root.mul(bb[0])));
  bb.push(c1.add(root.mul(bb[1])));
  bb.push(c0.add(root.mul(bb[2])));
  const b1=bb[1],b2=bb[2];
  add({id:'synth',sec:'eig',title:'Divide p(λ) by '+factorHTML(root),
    say:'Synthetic division with the root '+root.txt()+': bring down, multiply by '+pt(root)+', add.',
    build(st){
      const head=eqrow(['coefficients of p(λ): &nbsp;1, '+c2.html()+', '+c1.html()+', '+c0.html()+' &nbsp;·&nbsp; root '+root.html()]);
      const top=[root.html(),'1',c2.html(),c1.html(),c0.html()];
      const mid=['','',root.mul(bb[0]).html(),root.mul(bb[1]).html(),root.mul(bb[2]).html()];
      const bot=['',bb[0].html(),bb[1].html(),bb[2].html(),bb[3].html()];
      const grid=el('div','synth');
      const cells=[[],[],[]];
      [top,mid,bot].forEach((row,r)=>row.forEach((t,c)=>{
        const s=el('span','sc rv'+(c===0?' root':''),t);
        s.style.gridRow=String(r+1);s.style.gridColumn=String(c+1);
        if(r===0||c===0)s.classList.add('on');
        grid.appendChild(s);cells[r][c]=s;
      }));
      grid.appendChild(el('div','hline'));
      const cap=eqrow([NB],'calc');cap.spans[0].classList.add('on');
      const q=eqrow(['Quotient: <b>'+quadHTML(b1,b2)+'</b>, remainder 0']);
      const q2=eqrow(['p(λ) = '+factorHTML(root)+'('+quadHTML(b1,b2)+')'],'big');
      st.append(head.el,grid,cap.el,q.el,q2.el);on(head.spans);
      const coef=[c2,c1,c0];
      const steps=[[2,1,'Bring down the first coefficient: 1']];
      for(let k=0;k<3;k++){
        steps.push([1,k+2,'Multiply '+pt(root)+' × '+pt(bb[k])+' = '+root.mul(bb[k]).txt()+' and write it under '+coef[k].txt()]);
        steps.push([2,k+2,'Add: '+coef[k].txt()+' + '+pt(root.mul(bb[k]))+' = '+bb[k+1].txt()+(k===2?'. Remainder 0, so '+factorHTML(root)+' really is a factor ✓':'')]);
      }
      seq(steps.map(([r,c,t])=>()=>{on(cells[r][c]);if(r===2)cells[r][c].classList.add('res');cap.spans[0].innerHTML=t;}),1100,500);
      after(500+steps.length*1100,()=>on(q.spans));
      after(500+steps.length*1100+900,()=>on(q2.spans));
    }});

  /* ----- solve the quadratic ----- */
  const Dsc=b1.mul(b1).sub(R(4).mul(b2));
  const sq=sqrtFr(Dsc);
  let la=null,lb=null;
  if(sq){la=b1.neg().add(sq).div(R(2));lb=b1.neg().sub(sq).div(R(2));}
  add({id:'factor',sec:'eig',title:sq?'Solve the quadratic':'The quadratic has no rational roots',
    say:sq&&b1.isInt&&b2.isInt&&sq.isInt?'Find two numbers with product '+b2.txt()+' and sum '+b1.txt()+'.':'Use the quadratic formula: λ = (−b ± √(b² − 4c)) / 2.',
    build(st){
      let rows;
      if(sq&&b1.isInt&&b2.isInt&&sq.isInt){
        rows=[
          eqrow([quadHTML(b1,b2)+' = 0'],'big'),
          eqrow(['Product '+ph(b2)+' and sum '+ph(b1)+': &nbsp;<b>'+la.neg().html()+'</b> and <b>'+lb.neg().html()+'</b>']),
          eqrow([quadHTML(b1,b2)+' = '+factorHTML(la)+factorHTML(lb)],'big'),
          eqrow(['⟹ &nbsp;λ = '+la.html()+(la.eq(lb)?' (repeated root)':' &nbsp;or&nbsp; λ = '+lb.html())],'big')
        ];
      }else if(sq){
        rows=[
          eqrow([quadHTML(b1,b2)+' = 0'],'big'),
          eqrow(['b² − 4c = '+ph(b1)+'² − 4·'+pp(b2)+' = <b>'+Dsc.html()+'</b>, &nbsp;√ = '+sq.html()]),
          eqrow(['λ = ('+b1.neg().html()+' ± '+sq.html()+') / 2'],'big'),
          eqrow(['⟹ &nbsp;λ = '+la.html()+(la.eq(lb)?' (repeated root)':' &nbsp;or&nbsp; λ = '+lb.html())],'big')
        ];
      }else{
        const D=Dsc.val(),bv=b1.val();
        const roots=D>=0?[(-bv+Math.sqrt(D))/2,(-bv-Math.sqrt(D))/2].map(x=>rnd(x)):[rnd(-bv/2)+' + '+rnd(Math.sqrt(-D)/2)+'i',rnd(-bv/2)+' − '+rnd(Math.sqrt(-D)/2)+'i'];
        rows=[
          eqrow([quadHTML(b1,b2)+' = 0'],'big'),
          eqrow(['b² − 4c = '+ph(b1)+'² − 4·'+pp(b2)+' = <b>'+Dsc.html()+'</b>'+(D<0?' &nbsp;(negative: complex roots)':' &nbsp;(not a perfect square: irrational roots)')]),
          eqrow(['λ = ('+b1.neg().html()+' ± √('+Dsc.html()+')) / 2 &nbsp;≈ &nbsp;'+roots.join(' , ')],'big')
        ];
      }
      rows.forEach(x=>st.appendChild(x.el));
      seq(rows.map(x=>()=>on(x.spans)),1000,300);
    }});

  if(!sq){
    const D=Dsc.val(),bv=b1.val();
    const q=D>=0?[{re:(-bv+Math.sqrt(D))/2,im:0},{re:(-bv-Math.sqrt(D))/2,im:0}]:[{re:-bv/2,im:Math.sqrt(-D)/2},{re:-bv/2,im:-Math.sqrt(-D)/2}];
    const ev=[{re:root.val(),im:0}].concat(q).sort((p,r)=>r.re-p.re||r.im-p.im);
    return stopFrames(ev,D<0?'A has a pair of complex eigenvalues, so it cannot be diagonalized with real numbers. (With complex numbers it can, because the eigenvalues are distinct.)':'The eigenvalues are real but irrational. A is diagonalizable, but its eigenvectors contain square roots, and this app works in exact fractions.');
  }

  const lams=[root,la,lb].sort((u,v)=>v.val()-u.val());
  const groups=[];
  lams.forEach(l=>{const g=groups.find(x=>x.lam.eq(l));if(g)g.m++;else groups.push({lam:l,m:1});});
  const lsum=lams.reduce((s,x)=>s.add(x),ZERO);
  const lprod=lams.reduce((s,x)=>s.mul(x),ONE);

  add({id:'eigs',sec:'eig',title:'The eigenvalues',
    say:groups.length===3?'Three different eigenvalues for a 3×3 matrix means A is diagonalizable.':'An eigenvalue is repeated. A may or may not be diagonalizable: the eigenvectors decide.',
    build(st){
      const r=[
        eqrow(['p(λ) = '+lams.map(factorHTML).join('')+' = 0'],'big'),
        eqrow(['Eigenvalues: '+lams.map(l=>l.html()).join(', ')+(groups.length===3?' &nbsp;(three distinct values ⟹ <b>diagonalizable</b>)':' &nbsp;(repeated: we must count the independent eigenvectors)')]),
        eqrow(['Check: sum '+lams.map(l=>l.txt()).join(' + ')+' = '+lsum.txt()+' = tr A '+(lsum.eq(tr)?'✓':'✗')+' &nbsp;&nbsp; product '+lams.map(pt).join('·')+' = '+lprod.txt()+' = |A| '+(lprod.eq(dA)?'✓':'✗')]),
        eqrow(['We take them in the order'].concat(lams.map((l,i)=>'<span class="chipk k'+(groups.findIndex(g=>g.lam.eq(l))%3)+'">λ'+sub[i]+' = '+l.html()+'</span>')),'big')
      ];
      r.forEach(x=>st.appendChild(x.el));
      seq(r.map(x=>()=>on(x.spans)),1100,300);
    }});
  facts.push(['eigs',lams.map((l,i)=>'λ'+sub[i]+' = '+l.html()).join(', ')]);

  /* ===== 3. Eigenvectors ===== */
  const vecs=[],defects=[];
  groups.forEach((g,gi)=>{
    const lam=g.lam,kk=gi%3,label='λ = '+lam.txt();
    const Rn=A.map((row,r)=>row.map((v,c)=>r===c?v.sub(lam):v));
    const gj=gaussJordan(Rn);
    const free=n3.filter(c=>!gj.piv.includes(c));
    const basis=free.map(f=>{
      const v=[ZERO,ZERO,ZERO];v[f]=ONE;
      gj.piv.forEach((pc,ri)=>{v[pc]=gj.rref[ri][f].neg();});
      return v;
    });
    const scaled=basis.map(v=>{const Lc=v.reduce((l,x)=>lcm(l,x.d),1);return {Lc,w:v.map(x=>x.mul(R(Lc)))};});
    const startIdx=vecs.length;
    scaled.forEach(s=>vecs.push({v:s.w,lam,k:kk}));
    if(free.length<g.m)defects.push({lam,m:g.m,g:free.length});

    add({id:'e'+gi+'_shift',sec:'vec',title:label+': form A − λI',
      say:'Solve (A − λI)v = 0. First subtract λ from each diagonal entry.'+(g.m>1?' This eigenvalue appears '+g.m+' times, so we hope for '+g.m+' independent eigenvectors.':''),
      build(st){
        const a=mat(A);
        const li=mat(A.map((row,r)=>row.map((_,c)=>r===c?lam:ZERO)));
        const res=mat(Rn,{cellCls:()=>'ph'});
        const fx=el('div','flexrow');
        fx.append(a,el('span','op','−'),li,el('span','op','='),res);
        const cap=eqrow([NB],'calc');cap.spans[0].classList.add('on');
        const fin=eqrow(['(A − λI)v = 0, &nbsp;v = (x, y, z)ᵀ &nbsp;→ row-reduce this matrix'],'big');
        st.append(fx,cap.el,fin.el);
        const diagStep=i=>()=>{
          cellAt(a,i,i).classList.add('hi');cellAt(li,i,i).classList.add('hi');
          const x=cellAt(res,i,i);x.classList.remove('ph');x.classList.add('res');
          cap.spans[0].innerHTML=ph(A[i][i])+' − '+ph(lam)+' = <b>'+ph(Rn[i][i])+'</b>';
        };
        seq([
          ()=>{for(let r=0;r<3;r++)for(let c=0;c<3;c++)if(r!==c)cellAt(res,r,c).classList.remove('ph');cap.spans[0].innerHTML='Off-diagonal entries stay the same';},
          diagStep(0),diagStep(1),diagStep(2),
          ()=>on(fin.spans)
        ],1000,500);
      }});
    opFrames('e'+gi,'vec',label,Rn,gj.ops);

    const eqs=gj.piv.map((pc,ri)=>{
      let s=vn[pc];
      free.forEach(f=>{
        const e=gj.rref[ri][f];if(e.zero)return;
        const neg=e.neg0,a=neg?e.neg():e;
        s+=(neg?' − ':' + ')+(a.eq(ONE)?'':a.html())+vn[f];
      });
      return s+' = 0';
    });
    const lines=[];
    lines.push('Read the rows: &nbsp;'+(eqs.length?eqs.join(', &nbsp; '):'(no equations)')+(gj.piv.length<3?', &nbsp; 0 = 0':''));
    lines.push((free.length===1?'Column ':'Columns ')+free.map(f=>f+1).join(', ')+(free.length===1?' has':' have')+' no pivot, so '+free.map(f=>vn[f]).join(', ')+(free.length===1?' is':' are')+' free. Let '+free.map((f,k)=>vn[f]+' = '+pn[k]).join(', ')+'.');
    lines.push(n3.map(c=>{
      const fi=free.indexOf(c);
      if(fi>=0)return vn[c]+' = '+pn[fi];
      const ri=gj.piv.indexOf(c);
      return vn[c]+' = '+lin(free.map((f,k)=>[gj.rref[ri][f].neg(),pn[k]]));
    }).join(', &nbsp; '));
    lines.push('v = '+basis.map((v,k)=>pn[k]+'·('+v.map(x=>x.txt()).join(', ')+')ᵀ').join(' + '));
    scaled.forEach((s,k)=>{
      const nm='<span class="t'+kk+'">v'+sub[startIdx+k]+'</span>';
      const how=free.length>1?'Take only '+pn[k]+' = '+s.Lc+' (the others 0)':'Choose '+pn[k]+' = '+s.Lc+(s.Lc===1?'':' to clear the fractions');
      lines.push(how+': &nbsp;'+nm+' = '+vecHTML(s.w));
    });
    scaled.forEach((s,k)=>{
      const Aw=n3.map(i=>n3.reduce((t,j)=>t.add(A[i][j].mul(s.w[j])),ZERO));
      const okv=Aw.every((x,i)=>x.eq(lam.mul(s.w[i])));
      lines.push('Check: A·v'+sub[startIdx+k]+' = ('+Aw.map(x=>x.txt()).join(', ')+')ᵀ = '+pt(lam)+'·v'+sub[startIdx+k]+' '+(okv?'✓':'<span class="bad">✗</span>'));
    });
    if(free.length<g.m)lines.push('<span class="bad">Multiplicity '+g.m+' but only '+free.length+' independent eigenvector'+(free.length===1?'':'s')+'.</span>');
    add({id:'e'+gi+'_sol',sec:'vec',title:label+': read off the eigenvector'+(scaled.length>1?'s':''),
      say:'The matrix is fully reduced. Read off the solutions of (A − λI)v = 0.',
      build(st){
        const fx=el('div','flexrow');fx.append(el('span','op','reduced form'),mat(gj.rref,{cls:'md'}));
        st.appendChild(fx);
        const rs=lines.map(l=>{const r=eqrow([l]);st.appendChild(r.el);return r.spans[0];});
        seq(rs.map(s=>()=>on(s)),1100,400);
      }});
    scaled.forEach((s,k)=>facts.push(['e'+gi+'_sol','<span class="t'+kk+'">v'+sub[startIdx+k]+' = ('+s.w.map(x=>x.txt()).join(', ')+')ᵀ</span>']));
  });

  if(defects.length){
    add({id:'notdiag',sec:'vec',title:'A is not diagonalizable',
      say:'P needs 3 independent eigenvectors as columns, and A does not have them.',
      build(st){
        const rows=defects.map(d=>eqrow(['λ = '+d.lam.html()+': multiplicity '+d.m+', but only '+d.g+' independent eigenvector'+(d.g===1?'':'s')]));
        rows.push(eqrow(['Only '+vecs.length+' independent eigenvectors in total, so no invertible P exists with P⁻¹AP = D.'],'big'));
        rows.push(eqrow(['(Such a matrix can only be brought to Jordan form, not to a diagonal form.)'],'calc'));
        rows.forEach(x=>st.appendChild(x.el));
        seq(rows.map(x=>()=>on(x.spans)),1100,300);
      }});
    return {frames,facts,info:{diag:false,lams,vecs}};
  }

  /* ===== 4. P and D ===== */
  const PM=transpose(vecs.map(x=>x.v));
  const Dm=n3.map(i=>n3.map(j=>i===j?vecs[i].lam:ZERO));
  add({id:'P',sec:'pd',title:'Build P: eigenvectors as columns',
    say:'Put v₁, v₂, v₃ side by side, in the same order as the eigenvalues.',
    build(st){
      const k=vecs.map(x=>'k'+x.k);
      const vrow=el('div','flexrow');
      const boxes=vecs.map((x,i)=>{
        const b=el('div','vbox rv '+k[i],'<div class="cap">v'+sub[i]+' (λ = '+x.lam.html()+')</div>');
        b.appendChild(mat(x.v.map(e=>[e]),{cls:'md'}));vrow.appendChild(b);return b;
      });
      const pm=mat(PM,{cellCls:(r,c)=>'ph '+k[c]});
      const prow=el('div','flexrow');prow.append(el('span','op','P ='),pm);
      const note=eqrow(['Changing the order of the columns only changes the order of the eigenvalues in D.'],'calc');
      st.append(vrow,prow,note.el);
      const fns=[];
      for(let i=0;i<3;i++){
        fns.push(()=>on(boxes[i]));
        fns.push(()=>colCells(pm,i).forEach(x=>x.classList.remove('ph')));
      }
      fns.push(()=>on(note.spans));
      seq(fns,800,300);
    }});

  add({id:'D',sec:'pd',title:'Build D: eigenvalues on the diagonal',
    say:'Each eigenvalue goes in the same position as its eigenvector in P.',
    build(st){
      const k=vecs.map(x=>'k'+x.k);
      const pm=mat(PM,{cellCls:(r,c)=>k[c]});
      const dm=mat(Dm,{cellCls:(r,c)=>r===c?'ph '+k[r]:''});
      const fx=el('div','flexrow');
      fx.append(el('span','op','P ='),pm,el('span','op','D ='),dm);
      const r=eqrow(['D = diag(λ₁, λ₂, λ₃) = diag('+vecs.map(x=>x.lam.html()).join(', ')+')'],'big');
      st.append(fx,r.el);
      seq([0,1,2].map(i=>()=>{cellAt(dm,i,i).classList.remove('ph');cellAt(dm,i,i).classList.add('res');}).concat([()=>on(r.spans)]),900,400);
    }});
  facts.push(['P',()=>'P = '+mat(PM,{cls:'sm'}).outerHTML]);
  facts.push(['D',()=>'D = '+mat(Dm,{cls:'sm'}).outerHTML]);

  /* ===== 5. Inverse of P ===== */
  add({id:'invchoice',sec:'inv',title:'Two ways to find P⁻¹',
    say:'Pick the method your class knows best. You can switch from any step in this section.',
    build(st){
      const box=el('div','choice');
      [['rr','Row reduction','Write [P | I] and reduce it to [I | P⁻¹].'],
       ['adj','Adjoint method','P⁻¹ = (1/det P) · Adj P, using cofactors.']].forEach(([m,h,d])=>{
        const b=el('button','pick rv','<b>'+h+'</b><span>'+d+'</span>');b.type='button';
        b.addEventListener('click',()=>{invMethod=m;next();});
        box.appendChild(b);
      });
      st.appendChild(box);
      seq([...box.children].map(b=>()=>on(b)),400,200);
    }});

  /* --- method A: row reduction --- */
  const INV0=PM.map((row,i)=>row.concat(n3.map(j=>i===j?ONE:ZERO)));
  const gjInv=gaussJordan(INV0,3);
  const PinvRR=gjInv.rref.map(r=>r.slice(3));
  add({id:'inv0',sec:'inv',m:'rr',title:'Set up [P | I]',
    say:'Write P next to the identity matrix. Row-reduce until the left block becomes I; the right block is then P⁻¹.',
    build(st){
      const {wrap,m}=matBox(INV0,{labels:true,split:3});
      const fx=el('div','flexrow');fx.append(wrap);
      const r=eqrow(['[ P | I ] &nbsp;→ &nbsp;[ I | P⁻¹ ]'],'big');
      st.append(fx,r.el);
      seq([
        ()=>{for(let i=0;i<3;i++)rowCells(m,i).forEach(x=>x.classList.add(+x.dataset.c<3?'piv':'hi'));},
        ()=>on(r.spans)
      ],900,400);
    }});
  opFrames('inv','inv','Finding P⁻¹',INV0,gjInv.ops,3,'rr');
  add({id:'inv_res',sec:'inv',m:'rr',title:'Read off P⁻¹',
    say:'The left block is now I. The right block is P⁻¹.',
    build(st){
      const {wrap,m}=matBox(gjInv.rref,{labels:true,split:3});
      const fx=el('div','flexrow');fx.append(wrap);
      const out=el('div','flexrow rv');out.append(el('span','op','P⁻¹ ='),mat(PinvRR));
      st.append(fx,out);
      seq([
        ()=>{for(let i=0;i<3;i++)rowCells(m,i).forEach(x=>{if(+x.dataset.c>=3)x.classList.add('hi');});},
        ()=>on(out)
      ],1000,400);
    }});

  /* --- method B: adjoint --- */
  const COF=n3.map(i=>n3.map(j=>cofOf(PM,i,j)));
  const ADJ=transpose(COF);
  const dP=det3(PM);
  const Pinv=ADJ.map(r=>r.map(x=>x.div(dP)));
  const dpd=detFrame({id:'adj_det',sec:'inv',m:'adj',title:'Adjoint method: determinant of P',Mx:PM,name:'P'});

  add({id:'adj_formula',sec:'inv',m:'adj',title:'The formula',
    say:'Adj P is the transpose of the cofactor matrix.',
    build(st){
      const r1=eqrow(['P⁻¹ = <span class="boxed">1 / det P · Adj P</span>'],'big');
      const r2=eqrow(['Adj P = (cofactor matrix)ᵀ, &nbsp;Cᵢⱼ = (−1)ⁱ⁺ʲ · Mᵢⱼ']);
      const r3=eqrow(['Mᵢⱼ = determinant left after deleting row i and column j']);
      const sg=el('div','flexrow rv');
      sg.append(el('span','op','signs'),mat([['+','−','+'],['−','+','−'],['+','−','+']],{cls:'md'}));
      st.append(r1.el,r2.el,r3.el,sg);
      seq([()=>on(r1.spans),()=>on(r2.spans),()=>on(r3.spans),()=>on(sg)],900,300);
    }});

  n3.forEach(i=>{
    add({id:'adj_c'+i,sec:'inv',m:'adj',title:'Cofactors of row '+(i+1),
      say:'For each entry: cross out its row and column, take the 2×2 determinant, then apply the sign.',
      build(st){
        const m=mat(PM),sm=mat([[NB,NB],[NB,NB]],{cls:'det'});
        const cm=mat(COF.map((row,r)=>row.map(v=>r<i?v:NB)),{cls:'md'});
        const fx1=el('div','flexrow');fx1.append(m,el('span','op','→'),sm);
        const fx2=el('div','flexrow');fx2.append(el('span','op','cofactor matrix C ='),cm);
        const cap=eqrow([NB],'big');cap.spans[0].classList.add('on');
        st.append(fx1,cap.el,fx2);
        n3.forEach(j=>{
          const {S,val}=minorOf(PM,i,j),s=((i+j)%2===0)?1:-1,cf=COF[i][j];
          after(500+j*1800,()=>{
            for(let r=0;r<3;r++)for(let c=0;c<3;c++)cellAt(m,r,c).className='cell'+((r===i||c===j)?' dim':' hi');
            S.forEach((row,r)=>row.forEach((v,c)=>{cellAt(sm,r,c).innerHTML=ch(v);}));
            cap.spans[0].innerHTML='M'+sub[i]+sub[j]+' = '+pp(S[0][0])+'·'+pp(S[1][1])+' − '+pp(S[0][1])+'·'+pp(S[1][0])+' = '+ph(val);
          });
          after(500+j*1800+900,()=>{
            cap.spans[0].innerHTML='C'+sub[i]+sub[j]+' = ('+(s>0?'+1':'−1')+') · '+pp(val)+' = <b>'+ph(cf)+'</b>';
            const x=cellAt(cm,i,j);x.innerHTML=ch(cf);x.classList.add('res');
          });
        });
        after(500+3*1800,()=>{
          for(let r=0;r<3;r++)for(let c=0;c<3;c++)cellAt(m,r,c).className='cell';
          cap.spans[0].innerHTML='Row '+(i+1)+' of the cofactor matrix is done ✓';
        });
      }});
  });

  add({id:'adj_T',sec:'inv',m:'adj',title:'Transpose the cofactor matrix',
    say:'Adj P = Cᵀ: rows become columns.',
    build(st){
      const cm=mat(COF,{cls:'md'}),am=mat(COF.map(r=>r.map(()=>NB)),{cls:'md'});
      const fx=el('div','flexrow');
      fx.append(el('span','op','C ='),cm,el('span','op','→'),el('span','op','Adj P = Cᵀ ='),am);
      const cap=eqrow([NB],'calc');cap.spans[0].classList.add('on');
      st.append(fx,cap.el);
      const order=[[0,0],[1,1],[2,2],[0,1],[0,2],[1,2]];
      const fns=order.map(([i,j])=>()=>{
        st.querySelectorAll('.hi').forEach(x=>x.classList.remove('hi'));
        [[i,j],[j,i]].forEach(([r,c])=>{
          cellAt(cm,r,c).classList.add('hi');
          const x=cellAt(am,r,c);x.innerHTML=ch(COF[c][r]);x.classList.add('res');
        });
        cap.spans[0].innerHTML=i===j?'Diagonal entry ('+(i+1)+', '+(i+1)+') stays in place':'Swap entries ('+(i+1)+', '+(j+1)+') and ('+(j+1)+', '+(i+1)+')';
      });
      fns.push(()=>{st.querySelectorAll('.hi').forEach(x=>x.classList.remove('hi'));cap.spans[0].innerHTML='Adj P is complete ✓';});
      seq(fns,1000,500);
    }});

  add({id:'adj_res',sec:'inv',m:'adj',title:'P⁻¹ = (1/det P) · Adj P',
    say:'Divide every entry of Adj P by det P = '+dP.txt()+'.',
    build(st){
      const fx=el('div','flexrow');
      const res=el('div','flexrow rv');
      fx.append(el('span','op','P⁻¹ = '+(dP.isInt&&!dP.neg0?'(1/'+dP.txt()+')':'(1/'+pt(dP)+')')+' ·'),mat(ADJ));
      res.append(el('span','op','P⁻¹ ='),mat(Pinv));
      const note=eqrow([dP.eq(ONE)?'det P = 1, so dividing changes nothing here.':dP.eq(R(-1))?'det P = −1, so every entry changes sign.':'Every entry of Adj P is divided by det P = '+dP.html()+'.'],'calc');
      st.append(fx,res,note.el);
      seq([()=>on(res),()=>on(note.spans)],1000,500);
    }});

  facts.push(['inv_res',()=>'P⁻¹ = '+mat(PinvRR,{cls:'sm'}).outerHTML]);
  facts.push(['adj_res',()=>'P⁻¹ = '+mat(Pinv,{cls:'sm'}).outerHTML]);

  /* ===== 6. Check ===== */
  function mulFrame(o){
    const Res=mulM(o.L,o.R);
    add({id:o.id,sec:'ver',title:o.title,say:o.say,
      build(st){
        const lm=mat(o.L),rm=mat(o.R),om=mat(Res,{cellCls:()=>'ph'});
        const fx=el('div','flexrow');fx.append(lm,el('span','op','×'),rm,el('span','op','='),om);
        const cap=eqrow([NB],'calc');cap.spans[0].classList.add('on');
        const tl=eqrow([o.tail],'big');
        st.append(fx,cap.el,tl.el);
        let t=0;
        for(let i=0;i<3;i++)for(let j=0;j<3;j++){
          const s=t++;
          after(500+s*950,()=>{
            st.querySelectorAll('.hi,.piv').forEach(x=>x.classList.remove('hi','piv'));
            rowCells(lm,i).forEach(x=>x.classList.add('hi'));
            colCells(rm,j).forEach(x=>x.classList.add('piv'));
            const terms=o.L[i].map((a,q)=>pt(a)+'·'+pt(o.R[q][j])).join(' + ');
            cap.spans[0].innerHTML='row '+(i+1)+' · column '+(j+1)+': &nbsp;'+terms+' = <b>'+ph(Res[i][j])+'</b>';
            const c=cellAt(om,i,j);c.innerHTML=ch(Res[i][j]);c.classList.remove('ph');c.classList.add('res');
          });
        }
        after(500+t*950,()=>{
          st.querySelectorAll('.hi,.piv').forEach(x=>x.classList.remove('hi','piv'));
          cap.spans[0].innerHTML='Done ✓';on(tl.spans);
        });
      }});
    return Res;
  }
  const APm=mulM(A,PM);
  mulFrame({id:'ver1',title:'Check 1 of 2: compute A·P',say:'Each entry is (row of A) · (column of P). Watch the highlighted row and column.',
    L:A,R:PM,tail:'Every column of AP is λ times the same column of P, because A·v = λ·v'});
  const chk=mulFrame({id:'ver2',title:'Check 2 of 2: compute P⁻¹·(AP)',say:'Now multiply the result by P⁻¹ on the left.',
    L:Pinv,R:APm,tail:'The eigenvalues appear on the diagonal: P⁻¹AP = D '+(eqM(chk0(Pinv,APm),Dm)?'✓':'✗')});
  function chk0(X,Y){return mulM(X,Y);}

  add({id:'done',sec:'ver',title:'P⁻¹AP = D',
    say:'A is diagonalized.',
    build(st){
      const fx=el('div','flexrow rv');
      fx.append(mat(Pinv,{cls:'md'}),mat(A,{cls:'md'}),mat(PM,{cls:'md'}),el('span','op','='),mat(Dm,{cls:'md'}));
      const r=[
        eqrow(['A = P D P⁻¹'],'big'),
        eqrow(['λ from the characteristic equation &nbsp;·&nbsp; v from (A − λI)v = 0 &nbsp;·&nbsp; P = [v₁ v₂ v₃], D = diag(λ₁, λ₂, λ₃)'],'calc')
      ];
      st.append(fx,r[0].el,r[1].el);
      seq([()=>on(fx),()=>on(r[0].spans),()=>on(r[1].spans)],900,300);
    }});

  void chk;void dpd;
  return {frames,facts,info:{diag:true,lams,vecs,P:PM,D:Dm,Pinv,PinvRR}};
}

/* =====================================================================
   App
   ===================================================================== */
let idx=0;
let curA=null;
let curText=['1','2','0','0','3','0','2','-4','2'];
const DEFAULT_TEXT=['1','2','0','0','3','0','2','-4','2'];
const PRESETS=[
  {name:'Default example',t:DEFAULT_TEXT},
  {name:'Repeated eigenvalue, still diagonalizable',t:['2','1','1','1','2','1','1','1','2']},
  {name:'Not diagonalizable',t:['2','1','0','0','2','0','0','0','3']},
  {name:'Complex eigenvalues',t:['0','-1','0','1','0','0','0','0','1']}
];

function renderFacts(){
  const box=$('facts');box.innerHTML='';
  factDefs.forEach(([id,h])=>{
    const at=idxOf(id);
    if(at>=0&&idx>at&&isVis(frames[at]))box.appendChild(el('div','fact'+(idx===at+1?' pop':''),typeof h==='function'?h():h));
  });
  if(!box.children.length)box.innerHTML='<div class="muted small">Results collect here as each step finishes.</div>';
}
function buildChips(){
  const box=$('chips');box.innerHTML='';
  sections.filter(s=>frames.some(f=>f.sec===s.id)).forEach(s=>{
    const b=el('button','chip',s.name);b.type='button';b.dataset.sec=s.id;
    b.addEventListener('click',()=>go(frames.findIndex(x=>x.sec===s.id&&isVis(x))));
    box.appendChild(b);
  });
}
function renderChips(){
  const order=sections.map(s=>s.id),ci=order.indexOf(frames[idx].sec);
  [...$('chips').children].forEach(b=>{
    const bi=order.indexOf(b.dataset.sec);
    b.classList.toggle('cur',bi===ci);
    b.classList.toggle('done',bi<ci);
    if(bi===ci)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');
  });
}
function switcher(m){
  const other=m==='rr'?'adj':'rr';
  const d=el('div','mswitch');
  d.append('Method: '+(m==='rr'?'row reduction [P | I]':'adjoint, 1/det P · Adj P'));
  const b=el('button','','Switch to '+(other==='rr'?'row reduction':'the adjoint method'));
  b.type='button';
  b.addEventListener('click',()=>{invMethod=other;go(frames.findIndex(x=>x.m===other));});
  d.appendChild(b);
  return d;
}
function render(){
  clearTimers();
  const fr=frames[idx];
  const sec=sections.find(s=>s.id===fr.sec);
  const v=vis(),pos=v.indexOf(idx);
  $('kicker').textContent=sec.name+' · step '+(pos+1)+' of '+v.length;
  $('title').textContent=fr.title;
  $('say').innerHTML=fr.say||'';
  const st=$('stage');st.innerHTML='';
  fr.build(st);
  if(fr.m)st.insertBefore(switcher(fr.m),st.firstChild);
  $('bar').style.width=(v.length>1?pos/(v.length-1)*100:100)+'%';
  $('count').textContent=(pos+1)+' / '+v.length;
  $('back').disabled=pos===0;
  $('next').textContent=pos===v.length-1?'Restart ↺':'Next →';
  renderChips();renderFacts();
  $('main').scrollTop=0;
}
const go=i=>{idx=Math.max(0,Math.min(frames.length-1,i));render();};
const next=()=>{const v=vis(),k=v.indexOf(idx);go(k===v.length-1?v[0]:v[k+1]);};
const back=()=>{const v=vis(),k=v.indexOf(idx);if(k>0)go(v[k-1]);};

function setMatrix(Afr){
  const res=makeFrames(Afr);
  curA=Afr;frames=res.frames;factDefs=res.facts;
  invMethod='rr';idx=0;
  buildChips();
  const am=$('amini');am.innerHTML='';
  am.append('A =',mat(Afr,{cls:'sm'}));
  render();
}

/* ---------- speed ---------- */
function applySpeed(){
  document.documentElement.style.setProperty('--spd',MULT[speed]);
  [...$('speed').querySelectorAll('button')].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===speed)));
}
try{const sv=localStorage.getItem('diag-speed');if(sv&&MULT[sv])speed=sv;}catch(e){}
applySpeed();
$('speed').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  speed=b.dataset.s;applySpeed();
  try{localStorage.setItem('diag-speed',speed);}catch(err){}
  render();
});

/* ---------- matrix entry dialog ---------- */
const inputs=[];
(function buildEntry(){
  const box=$('entry');
  for(let k=0;k<9;k++){
    const inp=document.createElement('input');
    inp.type='text';inp.autocomplete='off';inp.spellcheck=false;
    inp.setAttribute('aria-label','Row '+(Math.floor(k/3)+1)+', column '+(k%3+1));
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();submitEntry();}
    });
    inp.addEventListener('input',()=>{inp.classList.remove('invalid');$('err').textContent='';});
    box.appendChild(inp);inputs.push(inp);
  }
  PRESETS.forEach(p=>{
    const b=el('button','',p.name);b.type='button';
    b.addEventListener('click',()=>{fillInputs(p.t);inputs[0].focus();});
    $('presets').appendChild(b);
  });
})();
function fillInputs(t){inputs.forEach((inp,k)=>{inp.value=t[k];inp.classList.remove('invalid');});$('err').textContent='';}
function openDialog(){
  fillInputs(curText);
  $('overlay').classList.add('open');
  inputs[0].focus();inputs[0].select();
}
function closeDialog(){$('overlay').classList.remove('open');$('chmat').focus();}
function submitEntry(){
  const vals=[];
  for(let k=0;k<9;k++){
    try{vals.push(parseEntry(inputs[k].value));}
    catch(e){
      inputs[k].classList.add('invalid');inputs[k].focus();
      $('err').textContent=e.message==='big'?'Row '+(Math.floor(k/3)+1)+', column '+(k%3+1)+': keep entries between −1000 and 1000.':'Row '+(Math.floor(k/3)+1)+', column '+(k%3+1)+': enter a number like 3, −2, 0.5 or 1/2.';
      return;
    }
  }
  const Afr=[vals.slice(0,3),vals.slice(3,6),vals.slice(6,9)];
  try{
    setMatrix(Afr);
  }catch(e){
    $('err').textContent='Could not process this matrix. '+e.message;
    if(curA)setMatrix(curA);
    return;
  }
  curText=inputs.map(i=>i.value.trim()===''?'0':i.value.trim());
  closeDialog();
}
$('chmat').addEventListener('click',openDialog);
$('cancel').addEventListener('click',closeDialog);
$('gobtn').addEventListener('click',submitEntry);
$('overlay').addEventListener('mousedown',e=>{if(e.target===$('overlay'))closeDialog();});

/* ---------- navigation ---------- */
$('next').addEventListener('click',next);
$('back').addEventListener('click',back);
$('replay').addEventListener('click',render);
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if($('overlay').classList.contains('open')){if(e.key==='Escape')closeDialog();return;}
  const t=e.target;
  if(t&&t.tagName==='INPUT')return;
  const onBtn=t&&t.closest&&t.closest('button');
  if((e.key===' '||e.key==='Enter')&&onBtn)return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();back();}
  else if(e.key==='r'||e.key==='R'){render();}
});
let theme=null;
$('theme').addEventListener('click',()=>{
  const dark=theme?theme==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';
  document.documentElement.setAttribute('data-theme',theme);
});

setMatrix(DEFAULT_TEXT.map(parseEntry).reduce((rows,v,k)=>{if(k%3===0)rows.push([]);rows[rows.length-1].push(v);return rows;},[]));
})();
</script>
