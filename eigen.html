<script>
"use strict";
const $=s=>document.querySelector(s),B=BigInt;
/* ---------- exact fractions ---------- */
const gcd=(a,b)=>{a<0n&&(a=-a);b<0n&&(b=-b);while(b)[a,b]=[b,a%b];return a};
const F=(n,d=1n)=>{n=B(n);d=B(d);if(d<0n){n=-n;d=-d}const g=gcd(n,d)||1n;return{n:n/g,d:d/g}};
const add=(x,y)=>F(x.n*y.d+y.n*x.d,x.d*y.d),sub=(x,y)=>F(x.n*y.d-y.n*x.d,x.d*y.d),mul=(x,y)=>F(x.n*y.n,x.d*y.d),dv=(x,y)=>F(x.n*y.d,x.d*y.n),neg=x=>F(-x.n,x.d);
const fl=x=>Number(x.n)/Number(x.d),zero=x=>x.n===0n,eq=(x,y)=>x.n===y.n&&x.d===y.d;
const sfs=x=>x.d===1n?String(x.n):x.n+'/'+x.d,fs=x=>sfs(x).replace('-','−'),P=x=>x.n<0n?'('+fs(x)+')':fs(x);
function parse(s){s=String(s).trim().replace(/[−–]/g,'-');if(!s||s.length>12)return null;let m=s.match(/^([+-]?\d+)\s*\/\s*([+-]?\d+)$/);
 if(m)return B(m[2])===0n?null:F(m[1],m[2]);
 if(/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)){const t=s.replace(/^[+-]/,''),[i,f='']=t.split('.'),n=B((i||'0')+f);return F(s[0]==='-'?-n:n,10n**B(f.length))}return null}
const sqrtInt=n=>{if(n<0n)return null;let r=B(Math.floor(Math.sqrt(Number(n))));while(r*r>n)r--;while((r+1n)*(r+1n)<=n)r++;return r*r===n?r:null};
const sqrtF=x=>{const a=sqrtInt(x.n),b=sqrtInt(x.d);return a!==null&&b!==null?F(a,b):null};
function rad(x){if(x.d===1n){let n=x.n,k=1n;for(let i=2n;i*i<=n&&i<3000n;i++)while(n%(i*i)===0n){n/=i*i;k*=i}return(k>1n?k:'')+'√'+n}return'√('+fs(x)+')'}
const mv=(M,w)=>[add(mul(M[0],w[0]),mul(M[1],w[1])),add(mul(M[2],w[0]),mul(M[3],w[1]))];
const detF=M=>sub(mul(M[0],M[3]),mul(M[1],M[2])),f2=p=>p.map(fl);
function prim(x,y){const L=x.d*y.d/gcd(x.d,y.d);let X=x.n*(L/x.d),Y=y.n*(L/y.d);const g=gcd(X,Y)||1n;X/=g;Y/=g;if(X<0n||(X===0n&&Y<0n)){X=-X;Y=-Y}return[F(X),F(Y)]}
function evec(M,l){const[a,b,c,d]=M;if(!zero(b))return prim(b,sub(l,a));if(!zero(c))return prim(sub(l,d),c);return eq(l,a)?[F(1),F(0)]:[F(0),F(1)]}
function eigen(M){const[a,b,c,d]=M,t=add(a,d),dt=detF(M),disc=sub(mul(t,t),mul(F(4),dt)),two=F(2),E={t,dt,disc};
 if(zero(disc)){E.k='rep';const l=dv(t,two);E.l=[l];E.all=zero(b)&&zero(c);E.vs=E.all?[]:[evec(M,l)];E.ls=[fs(l)];E.lf=[fl(l)];E.vf=E.vs.map(f2)}
 else if(disc.n<0n){E.k='cx';const re=dv(t,two),nd=neg(disc),q=sqrtF(nd),im=q?fs(dv(q,two)):rad(nd)+'/2';E.ls=[fs(re)+' + '+im+' i',fs(re)+' − '+im+' i'];E.lf=[];E.vs=[];E.vf=[]}
 else{E.k='re';const s=sqrtF(disc);
  if(s){const l1=dv(sub(t,s),two),l2=dv(add(t,s),two);E.l=[l1,l2];E.ls=[fs(l1),fs(l2)];E.lf=E.l.map(fl);E.vs=E.l.map(l=>evec(M,l));E.vf=E.vs.map(f2)}
  else{const sd=Math.sqrt(fl(disc)),tf=fl(t),r=rad(disc);E.ex=1;E.ls=['('+fs(t)+' − '+r+')/2','('+fs(t)+' + '+r+')/2'];E.lf=[(tf-sd)/2,(tf+sd)/2];E.vs=[];
   E.vf=E.lf.map(l=>{let x,y;if(!zero(b)){x=fl(b);y=l-fl(a)}else{x=l-fl(d);y=fl(c)}const h=Math.hypot(x,y)||1;return[x/h,y/h]})}}
 return E}
/* ---------- state ---------- */
let A=[F(3),F(-2),F(-1),F(4)],v=[F(1),F(1)],SP=1,spi=1,cur=0,tok=0,pg=false,D,gi=0,V={R:3,sc:100};
const SQ=[[0,0],[1,0],[1,1],[0,1]].map(p=>p.map(n=>F(n))),ROT=[0,-1,1,0].map(n=>F(n)),BL='var(--bl)',RD='var(--rd)';
function rc(){D={Av:mv(A,v),cs:SQ.map(c=>mv(A,c)),det:detF(A),E:eigen(A)}}
const lamTxt=i=>D.E.ls[i]+(D.E.ex?' ≈ '+D.E.lf[i].toFixed(3):'');
const vs=p=>'('+fs(p[0])+', '+fs(p[1])+')',vsf=w=>'≈ ('+w.map(z=>z.toFixed(3)).join(', ')+')';
const mt=M=>`<table class="m"><tr><td>${fs(M[0])}</td><td>${fs(M[1])}</td></tr><tr><td>${fs(M[2])}</td><td>${fs(M[3])}</td></tr></table>`;
const vt=w=>`<table class="m"><tr><td>${fs(w[0])}</td></tr><tr><td>${fs(w[1])}</td></tr></table>`;
const mtxt=M=>'['+fs(M[0])+' '+fs(M[1])+'; '+fs(M[2])+' '+fs(M[3])+']',eqs=(M,w,o)=>mtxt(M)+' · ['+fs(w[0])+'; '+fs(w[1])+'] = ['+fs(o[0])+'; '+fs(o[1])+']';
/* ---------- timing (global speed multiplier SP) ---------- */
const sleep=(ms,T)=>new Promise(r=>setTimeout(()=>r(T===tok),ms*SP));
function anim(dur,fn,T){return new Promise(res=>{let p=0,l=performance.now();const f=n=>{if(T!==tok)return res(false);p+=(n-l)/(dur*SP);l=n;if(p>=1){fn(1);return res(true)}fn(p);requestAnimationFrame(f)};fn(0);requestAnimationFrame(f)})}
const es=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,lp=(a,b,p)=>[a[0]+(b[0]-a[0])*p,a[1]+(b[1]-a[1])*p];
/* ---------- drawing ---------- */
const X=x=>300+x*V.sc,Y=y=>300-y*V.sc,setR=R=>{V.R=R;V.sc=300/R};
const rng=pts=>{const m=Math.max(0,...pts.flat(9).map(Math.abs));return Number.isFinite(m)?Math.max(3,Math.ceil(m*1.25)):3};
function base(){const R=V.R,ts=R<=10?1:Math.ceil(R/8),n=Math.floor(R/ts)*ts;let s='';
 for(let k=-n;k<=n;k+=ts){s+=`<line class="g" x1="${X(k)}" y1="0" x2="${X(k)}" y2="600"/><line class="g" x1="0" y1="${Y(k)}" x2="600" y2="${Y(k)}"/>`;
  if(k){s+=`<line class="ax" x1="${X(k)}" y1="294" x2="${X(k)}" y2="306"/><line class="ax" x1="294" y1="${Y(k)}" x2="306" y2="${Y(k)}"/><text class="tk" x="${X(k)}" y="324" text-anchor="middle">${k}</text><text class="tk" x="288" y="${Y(k)+5}" text-anchor="end">${k}</text>`}}
 return s+`<line class="ax" x1="0" y1="300" x2="590" y2="300"/><line class="ax" x1="300" y1="600" x2="300" y2="10"/><polygon class="axh" points="598,300 582,293 582,307"/><polygon class="axh" points="300,2 293,18 307,18"/><text x="580" y="284">x</text><text x="312" y="24">y</text><text x="288" y="318" text-anchor="end">O</text>`}
const show=(...a)=>{$('#pl').innerHTML=base()+a.join('')};
function arr(x,y,col,lab,w=7,x0=0,y0=0,dash){const ax=X(x0),ay=Y(y0),bx=X(x),by=Y(y),dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy);if(L<3)return'';const ux=dx/L,uy=dy/L,h=Math.min(24,L*.6);
 return `<line x1="${ax}" y1="${ay}" x2="${bx-ux*h*.8}" y2="${by-uy*h*.8}" style="stroke:${col};stroke-width:${w};stroke-linecap:round"${dash?' stroke-dasharray="10 8"':''}/><polygon style="fill:${col}" points="${bx},${by} ${bx-ux*h+uy*h*.45},${by-uy*h-ux*h*.45} ${bx-ux*h-uy*h*.45},${by-uy*h+ux*h*.45}"/>`+(lab?`<text class="lb" style="fill:${col}" x="${bx+ux*20+(ux>=0?4:-4)}" y="${by+uy*20+6}" text-anchor="${ux>=0?'start':'end'}">${lab}</text>`:'')}
const poly=(pts,cls,op=1)=>`<polygon class="${cls}" style="opacity:${op}" points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`;
const tx=(x,y,s,col,dx=0,dy=0,an='middle')=>`<text class="lb" style="fill:${col||'var(--fg)'}" x="${X(x)+dx}" y="${Y(y)+dy}" text-anchor="${an}">${s}</text>`;
const dot=(x,y,col)=>`<circle cx="${X(x)}" cy="${Y(y)}" r="8" style="fill:${col}"/>`;
function arc(r,a0,a1,col){let p=[];for(let i=0;i<=40;i++){const a=a0+(a1-a0)*i/40;p.push(X(r*Math.cos(a))+','+Y(r*Math.sin(a)))}return `<polyline points="${p.join(' ')}" style="fill:none;stroke:${col};stroke-width:4"/>`}
const elin=(w,R)=>`<line class="el" x1="${X(-w[0]*R*1.5)}" y1="${Y(-w[1]*R*1.5)}" x2="${X(w[0]*R*1.5)}" y2="${Y(w[1]*R*1.5)}"/>`;
const bigtxt=s=>`<text class="big" x="16" y="40">${s}</text>`;
const area=p=>{let s=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];s+=p[i][0]*q[1]-q[0]*p[i][1]}return s/2};
/* ---------- calculation animation ---------- */
const C=h=>{$('#calc').innerHTML=h},cap=h=>{$('#cap').innerHTML=h};
function rmv(M,w,r,s,out){let m='<table class="m">';for(let i=0;i<2;i++){m+='<tr'+(i===r&&s?' class="row"':'')+'>';for(let j=0;j<2;j++)m+=`<td class="${i===r&&s?'t'+j:''}">${fs(M[2*i+j])}</td>`;m+='</tr>'}m+='</table>';
 const q='<table class="m">'+[0,1].map(j=>`<tr><td class="${s&&r>=0?'t'+j:''}">${fs(w[j])}</td></tr>`).join('')+'</table>',
 o='<table class="m">'+[0,1].map(i=>`<tr><td class="${i===r&&s?'row':''}">${out[i]?fs(out[i]):'?'}</td></tr>`).join('')+'</table>';let ex='';
 if(r>=0&&s){const a=mul(M[2*r],w[0]),b=mul(M[2*r+1],w[1]);ex=s===1?`<b class="t0">${P(M[2*r])}·${P(w[0])}</b> + <b class="t1">${P(M[2*r+1])}·${P(w[1])}</b>`:s===2?`<b class="t0">${P(a)}</b> + <b class="t1">${P(b)}</b>`:'= '+fs(add(a,b))}
 return `<div class="eq">${m}<i>·</i>${q}<i>=</i>${o}</div><div class="ex">${ex}</div>`}
async function calcMV(M,w,T){const out=[null,null];C(rmv(M,w,-1,0,out));if(!await sleep(400,T))return;
 for(let r=0;r<2;r++)for(let s=1;s<=3;s++){if(s===3)out[r]=add(mul(M[2*r],w[0]),mul(M[2*r+1],w[1]));C(rmv(M,w,r,s,out));if(!await sleep(s===1?650:480,T))return}
 C(rmv(M,w,-1,0,out));return out}
function rdet(M,s){const t=(i,c)=>`<td class="${c}">${fs(M[i])}</td>`,c1=s===1?['t0','','','t0']:s===2?['','t1','t1','']:['','','',''];
 const[a,b,c,d]=M,p1=mul(a,d),p2=mul(b,c);let ex=`det A = <b class="${s===1?'t0':''}">${P(a)}·${P(d)}</b> − <b class="${s===2?'t1':''}">${P(b)}·${P(c)}</b>`;
 if(s>=1)ex+=`<br>= ${fs(p1)} − ${P(p2)}`;if(s>=3)ex+=` = <b>${fs(sub(p1,p2))}</b>`;
 return `<div class="eq"><table class="m"><tr>${t(0,c1[0])}${t(1,c1[1])}</tr><tr>${t(2,c1[2])}${t(3,c1[3])}</tr></table></div><div class="ex">${ex}</div>`}
async function calcDet(M,T){for(let s=0;s<=3;s++){C(rdet(M,s));if(!await sleep(s?900:500,T))return false}return true}
function note(){const E=D.E;let s='';if(zero(D.det))s+='det = 0: the square collapses, so the map cannot be undone. ';
 if(E.k==='cx')s+='Complex eigenvalues '+E.ls.join(' and ')+': every direction is turned, so no line stays on itself, and there is no real eigenvector.';
 else if(E.k==='rep')s+=E.all?'Repeated eigenvalue '+E.ls[0]+': A scales every direction equally, so every direction is an eigen-direction.':'Repeated eigenvalue '+E.ls[0]+' is a special case: just one eigen-direction '+vs(E.vs[0])+'.';
 else{const z=E.lf.findIndex(l=>Math.abs(l)<1e-12);if(z>=0)s+='Eigenvalue 0 has eigenvector '+(E.vs[z]?vs(E.vs[z]):vsf(E.vf[z]))+': it is squashed to the origin.'}return s}
/* ---------- steps ---------- */
const ST=[],S=(t,f)=>ST.push({t,f}),inv=()=>f2(v);
const morphPts=(M,p)=>SQ.map(c=>lp(f2(c),f2(mv(M,c)),p));

 ang=L<1e-9?null:Math.atan2(u[0]*o[1]-u[1]*o[0],u[0]*o[0]+u[1]*o[1])*180/Math.PI;
 C(`<div class="eq">${mt(A)}<i>·</i><table class="m"><tr><td>${u[0].toFixed(2)}</td></tr><tr><td>${u[1].toFixed(2)}</td></tr></table><i>=</i><table class="m"><tr><td>${o[0].toFixed(2)}</td></tr><tr><td>${o[1].toFixed(2)}</td></tr></table></div><div class="ex">v at ${((th*180/Math.PI)%360).toFixed(0)}°</div>`);let s=`<circle class="cir" cx="300" cy="300" r="${V.sc}"/><polyline class="tr" points="${c.tr.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`+(prev||[]).map(w=>elin(w,c.R)).join('')+(pin?elin(pin.w,c.R):'');
 s+=arr(o[0],o[1],RD,'out')+arr(u[0],u[1],BL,'in')+bigtxt('angle between v and Av = '+(ang===null?'—':(Math.abs(ang)<1e-6?0:ang).toFixed(1)+'°'+(Math.abs(ang)<1e-6?' = same direction':'')));
 if(pin)s+=tx(o[0],o[1],pin.t,RD,0,-34)+tx(u[0],u[1],pin.v,BL,0,44);return s}

const SEC=[['1 · A matrix moves a vector',0],['2 · Matrix as agent of transformation',4],['3 · The whole square',5],['4 · Determinant',8],['5 · Eigenvalues & eigenvectors',12],['6 · The inverse',15],['7 · The 3×3 case',16]];

function resHTML(){const E=D.E,r=[[3,'A·v',vs(D.Av)],[6,'Corner images',D.cs.map(vs).join(' ')],[8,'det A',fs(D.det)],[9,'Area factor','× '+fs(D.det)+(D.det.n<0n?' (flip)':'')]];
 if(E.k==='cx')r.push([13,'Eigenvalues',E.ls.join(', ')+' (no real eigenvector)']);else{const ds=dirs();if(!ds.length)r.push([13,'λ',E.ls[0]+' (every direction)']);ds.forEach((d,j)=>r.push([cur===12&&j<eigSeen?12:13,'λ'+(j+1)+', v'+(j+1),lamTxt(d.i)+' ,  '+(E.vs[d.i]?vs(E.vs[d.i]):vsf(d.w))]))}
 if(!zero(D.det)){const k=dv(F(1),D.det);r.push([15,'det A⁻¹',fs(k)])}
 return '<h3>Results so far</h3>'+r.filter(x=>x[0]<=cur).map(x=>`<div><span>${x[1]}</span>${x[2]}</div>`).join('')}
/* ---------- engine ---------- */
async function go(i){pg=false;$('#pg').hidden=true;cur=Math.max(0,Math.min(ST.length-1,i));const T=++tok;if(waiting)waiting();ui();
 try{await ST[cur].f(T)}catch(e){console.error(e);cap('Something went wrong in this step — press Next or Back to continue.')}}
function ui(){$('#ttl').textContent=pg?'Playground':ST[cur].t;$('#fill').style.width=pg?'100%':(cur+1)/ST.length*100+'%';$('#cnt').textContent=pg?'Playground':'Step '+(cur+1)+' / '+ST.length;
 $('#bk').disabled=!pg&&cur===0;$('#nx').disabled=!pg&&cur===ST.length-1;$('#res').hidden=pg||cur>=16;if(!pg)$('#res').innerHTML=resHTML();
 const sec=SEC.reduce((a,s,k)=>cur>=s[1]?k:a,0);[...$('#chips').children].forEach((b,k)=>b.classList.toggle('on',pg?k===SEC.length:k===sec));
 [...$('#spd').children].forEach((b,k)=>b.classList.toggle('on',k===spi))}
function setSpeed(k){spi=k;SP=[2,1,.5][k];ui()}
$('#chips').innerHTML=SEC.map((s,k)=>`<button data-k="${k}">${s[0]}</button>`).join('')+'<button data-k="pg">8 · Playground</button>';
$('#chips').onclick=e=>{const k=e.target.dataset.k;if(k==null)return;k==='pg'?enterPG():go(SEC[k][1])};
$('#spd').onclick=e=>{if(e.target.dataset.i)setSpeed(+e.target.dataset.i)};
$('#nx').onclick=()=>{if(waiting){waiting();return}go(pg?0:cur+1)};$('#bk').onclick=()=>go(pg?cur:cur-1);$('#rp').onclick=()=>go(cur);$('#own').onclick=enterPG;$('#show').onclick=()=>go(0);
$('#th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey)return;const k=e.key;
 if(k==='ArrowRight'||k===' '){e.preventDefault();if(!$('#nx').disabled||pg)$('#nx').click()}else if(k==='ArrowLeft'){if(!$('#bk').disabled)$('#bk').click()}else if(k==='r'||k==='R')$('#rp').click();else if(k==='s'||k==='S')setSpeed((spi+1)%3)});
/* ---------- playground ---------- */
const NM=['a','b','c','d','x','y'];
$('#pgin').innerHTML=NM.map(k=>`<label>${k}<input type="text" id="i_${k}" inputmode="decimal" autocomplete="off"><input type="range" id="s_${k}" min="-9" max="9" step="0.5"></label>`).join('');
const PRE=[['Rotation 90°',[0,-1,1,0]],['Reflection',[1,0,0,-1]],['Scaling',[2,0,0,3]],['Shear',[1,1,0,1]],['Singular',[1,2,2,4]],['Default A',[3,-2,-1,4],[1,1]]];
$('#pgp').innerHTML=PRE.map((p,i)=>`<button data-p="${i}">${p[0]}</button>`).join('');
$('#pgp').onclick=e=>{const p=PRE[e.target.dataset.p];if(!p)return;A=p[1].map(n=>F(n));if(p[2])v=p[2].map(n=>F(n));setBoxes();pgRead()};
function setBoxes(){[...A,...v].forEach((x,i)=>{$('#i_'+NM[i]).value=sfs(x);$('#s_'+NM[i]).value=fl(x)})}
function pgRead(){const vals=NM.map(k=>parse($('#i_'+k).value));if(vals.some(x=>!x)){$('#msg').textContent='Please type numbers like 3, −2.5 or 1/2 in every box. The picture keeps the last valid values.';return}
 $('#msg').textContent='';A=vals.slice(0,4);v=vals.slice(4);NM.forEach((k,i)=>{$('#s_'+k).value=fl(vals[i])});rc();pgDraw()}
$('#pgin').addEventListener('input',e=>{const t=e.target;if(t.type==='range')$('#i_'+t.id.slice(2)).value=t.value;pgRead()});
function pgDraw(){const E=D.E,sq=SQ.map(f2),im=D.cs.map(f2),x=inv(),o=f2(D.Av),R=rng([im,[x,o],...E.vf.map(w=>w)]);setR(R);
 show(poly(sq,'sq'),poly(im,'im'),E.vf.map(w=>elin(w,R)).join(''),arr(o[0],o[1],RD,'out'),arr(x[0],x[1],BL,'in'),`<circle cx="${X(x[0])}" cy="${Y(x[1])}" r="13" style="fill:${BL};stroke:var(--bg);stroke-width:3;cursor:grab"/>`);
 const ds=dirs();$('#pgout').innerHTML=`<div class="ex" style="font-size:clamp(17px,1.7vw,26px)">A·v = ${vs(D.Av)}<br>Corners: ${D.cs.map(vs).join(' ')}<br>det A = ${fs(D.det)} → area × ${fs(D.det)}${D.det.n<0n?' (orientation flips)':''}<br>`+
 (E.k==='cx'?'λ = '+E.ls.join(', '):ds.length?ds.map(d=>'λ = '+lamTxt(d.i)+', v '+(E.vs[d.i]?vs(E.vs[d.i]):vsf(d.w))).join('<br>'):'λ = '+E.ls[0])+`</div><p>${note()}</p>`}
function enterPG(){tok++;if(waiting)waiting();pg=true;$('#pg').hidden=false;C('');cap('');setBoxes();rc();ui();pgDraw()}
let drag=false;const dragTo=e=>{const r=$('#pl').getBoundingClientRect(),q=.25,wx=((e.clientX-r.left)/r.width*600-300)/V.sc,wy=-((e.clientY-r.top)/r.height*600-300)/V.sc;
 $('#i_x').value=String(Math.round(wx/q)*q);$('#i_y').value=String(Math.round(wy/q)*q);pgRead()};
$('#pl').addEventListener('pointerdown',e=>{if(!pg)return;drag=true;$('#pl').setPointerCapture(e.pointerId);dragTo(e)});$('#pl').addEventListener('pointermove',e=>{if(drag)dragTo(e)});$('#pl').addEventListener('pointerup',()=>{drag=false});
rc();ui();go(0);
</script></body></html>
